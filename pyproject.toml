[project]
name = "vision-fine-tuning"
version = "1.0.0"
description = "Reproducible YOLO26 pipeline for a navigation obstacle detector, from dataset to edge benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}

dependencies = [
    # Core
    "ultralytics>=8.4.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Vision
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",

    # Data
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.66.0",

    # UI
    "gradio>=5.0.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.14.0",
]

[project.optional-dependencies]
# Zero-shot auto-annotation with Grounding DINO
annotation = [
    "transformers>=4.40.0",
]

# Dataset tools (Open Images, Roboflow)
datasets = [
    "fiftyone>=1.0.0",
    "roboflow>=1.1.0",
]

# TensorRT / ONNX export and benchmarking on x86 Linux with an NVIDIA GPU.
# Declared here so Ultralytics does not pip-install them on the fly during export.
# (On Jetson these come from JetPack inside the Ultralytics container.)
export = [
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.71",
    "onnxruntime-gpu>=1.20; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorrt-cu12>=10.9,<11; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Explicit INT8 (Q/DQ ONNX) with NVIDIA TensorRT Model Optimizer. The quantized ONNX
# is portable: each device builds its own engine from the same INT8 scales.
quantize = [
    "nvidia-modelopt[onnx]>=0.46.1",
]

# Development and testing.
# SELF-SUFFICIENT by design: `uv sync --extra dev && pytest` must be green on a
# fresh clone. tests/test_grounding_dino.py imports transformers, so without the
# annotation extra pytest aborted during COLLECTION — one error killed the whole
# run and hid the other 45 passing tests, which reads as "the repo is broken"
# rather than "an extra is missing".
dev = [
    "pytest>=7.4.0",
    "vision-fine-tuning[annotation]",
]

# All optional dependencies
all = [
    "vision-fine-tuning[annotation,datasets,dev]",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
