<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cómo se construyó Vision Fine-Tuning</title>
<meta name="description" content="Bitácora técnica de vision-fine-tuning: fine-tuning de YOLO26 para navegación asistida, con código, métricas y límites. ES/EN.">
<meta property="og:title" content="How Vision Fine-Tuning was built">
<meta property="og:description" content="YOLO26 fine-tuning for assisted navigation: code, metrics and honest limits. ES/EN.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #e9edf1;
    --line: #c3ccd4;
    --line-soft: #d9dfe4;
    --text: #1b232c;
    --text-dim: #5b6773;
    --text-faint: #8894a0;
    --accent: #d9722c;
    --accent-2: #b3591f;
    --ok: #2f6f4f;
    --ok-soft: #dbeee1;
    --danger: #b3402c;
    --danger-soft: #f3ddd5;
    --warn: #3a5f8a;
    --code-bg: #171b1f;
    --code-text: #e6e6e0;
    --display: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #14181d;
      --surface: #1b2128;
      --surface-2: #222a32;
      --line: #3a444e;
      --line-soft: #2b333b;
      --text: #e8edf2;
      --text-dim: #9aa7b3;
      --text-faint: #6b7885;
      --accent: #e8975a;
      --accent-2: #f0ac78;
      --ok: #6bbf94;
      --ok-soft: #1e2f26;
      --danger: #d97a63;
      --danger-soft: #35201a;
      --warn: #7fa8d6;
      --code-bg: #0d1013;
      --code-text: #e6e6e0;
    }
  }
  :root[data-theme="dark"]{
    --bg: #14181d;
    --surface: #1b2128;
    --surface-2: #222a32;
    --line: #3a444e;
    --line-soft: #2b333b;
    --text: #e8edf2;
    --text-dim: #9aa7b3;
    --text-faint: #6b7885;
    --accent: #e8975a;
    --accent-2: #f0ac78;
    --ok: #6bbf94;
    --ok-soft: #1e2f26;
    --danger: #d97a63;
    --danger-soft: #35201a;
    --warn: #7fa8d6;
    --code-bg: #0d1013;
    --code-text: #e6e6e0;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Shell layout ===== */
  .shell{
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px){
    .shell{ grid-template-columns: 1fr; }
    .rail{ position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line-soft); }
  }

  /* ===== Rail (timeline nav) ===== */
  .rail{
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    border-right: 1px solid var(--line-soft);
    padding: 28px 20px 28px 26px;
    display: flex;
    flex-direction: column;
  }
  .rail-head{ margin-bottom: 28px; }
  .rail-eyebrow{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .rail-title{
    font-family: var(--display);
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    line-height: 1.25;
  }

  .steps{ list-style: none; margin: 0; padding: 0; position: relative; flex: 1; }
  .steps::before{
    content: "";
    position: absolute;
    left: 9px; top: 6px; bottom: 6px;
    width: 1px;
    background: var(--line);
  }
  .step-item{ position: relative; padding: 0 0 22px 30px; }
  .step-item:last-child{ padding-bottom: 0; }
  .step-dot{
    position: absolute; left: 3px; top: 2px;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--line);
    transition: border-color .2s ease, background .2s ease;
  }
  .step-btn{
    all: unset;
    cursor: pointer;
    display: block;
    width: 100%;
  }
  .step-num{
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }
  .step-label{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.4;
    margin-top: 2px;
  }
  .step-item.active .step-dot{ border-color: var(--accent); background: var(--accent); }
  .step-item.active .step-label{ color: var(--text); }
  .step-item.done .step-dot{ border-color: var(--ok); background: var(--ok); }
  .step-item:hover .step-label{ color: var(--text); }

  .rail-foot{
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    line-height: 1.6;
  }

  /* ===== Language toggle ===== */
  .lang-toggle{
    display: inline-flex;
    align-items: center;
    gap: 0;
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    cursor: pointer;
    padding: 0;
    font-family: var(--mono);
  }
  .lang-toggle span{
    padding: 4px 10px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    transition: background .15s ease, color .15s ease;
  }
  .lang-toggle span.on{
    background: var(--accent);
    color: #fff9f2;
    font-weight: 600;
  }
  .lang-toggle:hover{ border-color: var(--accent); }
  .lang-toggle:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== Main stage ===== */
  .stage{
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .panels{ flex: 1; position: relative; }
  .panel{
    display: none;
    padding: 56px 64px 40px;
    max-width: 880px;
    animation: rise .35s ease;
  }
  @media (max-width: 640px){ .panel{ padding: 36px 22px 28px; } }
  .panel.active{ display: block; }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .panel{ animation: none; }
  }

  .kicker{
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kicker .date{ color: var(--text-faint); text-transform: none; letter-spacing: 0; }

  h1.panel-title{
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.15;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .panel-sub{
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text-dim);
    max-width: 62ch;
    margin: 0 0 32px;
    line-height: 1.6;
  }

  .beat{
    display: grid;
    grid-template-columns: 108px 1fr;
    gap: 20px;
    padding: 18px 0;
    border-top: 1px solid var(--line-soft);
  }
  .beat:first-of-type{ border-top: none; }
  .beat-tag{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-top: 3px;
  }
  .beat-tag.problem{ color: var(--danger); }
  .beat-tag.decision{ color: var(--accent); }
  .beat-tag.result{ color: var(--ok); }
  .beat-body h3{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    margin: 0 0 6px;
  }
  .beat-body p{
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .beat-body p:last-child{ margin-bottom: 0; }
  .beat-body code{
    font-family: var(--mono);
    font-size: 0.92em;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text);
  }

  .codeblock{
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    overflow-x: auto;
    margin: 10px 0 8px;
    white-space: pre;
  }
  .codeblock .c1{ color: #8a8270; }
  .codeblock .num{ color: var(--accent-2); }

  .stat-row{
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 10px 0 8px;
  }
  .stat{
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 120px;
  }
  .stat .num{
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat .num .arrow{ color: var(--text-faint); font-weight: 400; font-size: 15px; padding: 0 4px; }
  .stat .lbl{ font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .stat.good .num{ color: var(--ok); }

  .commit-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 3px 8px;
    margin: 2px 4px 2px 0;
  }
  .commit-chip .hash{ color: var(--accent); }

  .arch-mini{
    display: flex;
    align-items: center;
    gap: 0;
    margin: 18px 0 6px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .arch-box{
    flex: 1;
    padding: 14px 12px;
    text-align: center;
    border-right: 1px solid var(--line-soft);
  }
  .arch-box:last-child{ border-right: none; }
  .arch-box.nocuda{ background: var(--surface); }
  .arch-box.cuda{ background: var(--surface-2); }
  .arch-box .t{ font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
  .arch-box .d{ font-size: 10.5px; color: var(--text-faint); margin-top: 3px; }
  .arch-box.nocuda .t{ color: #3a5f8a; }
  .arch-box.cuda .t{ color: var(--ok); }

  .threat-scale{ display: flex; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
  .threat-pill{
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .threat-pill .dot{ width: 7px; height: 7px; border-radius: 50%; }

  /* ===== Nav footer ===== */
  .stage-nav{
    position: sticky;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 64px;
    background: var(--bg);
    border-top: 1px solid var(--line-soft);
  }
  @media (max-width: 640px){ .stage-nav{ padding: 14px 22px; } }
  .nav-btn{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: border-color .15s ease, transform .1s ease;
  }
  .nav-btn:hover{ border-color: var(--accent); }
  .nav-btn:active{ transform: scale(0.98); }
  .nav-btn:disabled{ opacity: 0.35; cursor: default; }
  .nav-btn:disabled:hover{ border-color: var(--line); }
  .nav-btn.primary{ background: var(--accent); border-color: var(--accent); color: #fff9f2; }
  .nav-btn.primary:hover{ border-color: var(--accent-2); background: var(--accent-2); }
  .nav-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .progress-text{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  /* ===== Figures (diagrams) ===== */
  figure.fig{ margin: 20px 0 8px; }
  .fig-card{
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    padding: 18px 18px 6px;
    overflow-x: auto;
  }
  .fig-card svg{ display: block; max-width: 100%; height: auto; }
  figcaption{
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.55;
    margin-top: 10px;
    padding: 0 2px 2px;
  }

  /* ===== Deep-dive code panels ===== */
  .code-panel{
    margin: 12px 0 8px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
  }
  .code-panel-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line-soft);
  }
  .code-panel-head .fname{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .code-panel-head .flabel{
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .code-panel .codeblock{
    margin: 0;
    border-radius: 0;
  }
  .codeblock .kw{ color: #d6ab5f; }
  .codeblock .str{ color: #9fb98a; }
  .codeblock .fn{ color: #8fb3d9; }

  .explain-box{
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 0 7px 7px 0;
    padding: 14px 18px;
    margin: 10px 0 8px;
  }
  .explain-box h4{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10.5px;
  }
  .explain-box p{
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .explain-box p:last-child{ margin-bottom: 0; }
  .explain-box code{
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text);
  }

  /* ===== Q&A block (entrevista) ===== */
  .qa-section{
    margin-top: 34px;
    padding-top: 22px;
    border-top: 2px solid var(--line);
  }
  .qa-section-head{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .qa-section-head .icon{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 7px;
    letter-spacing: 0.04em;
  }
  .qa-section-head h3{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    margin: 0;
  }
  .qa-item{
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .qa-q{
    all: unset;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 13px 16px;
    cursor: pointer;
    box-sizing: border-box;
  }
  .qa-q:focus-visible{ outline: 2px solid var(--accent); outline-offset: -2px; }
  .qa-q .qmark{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    flex-shrink: 0;
    line-height: 1.5;
  }
  .qa-q .qtext{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
    flex: 1;
  }
  .qa-q .chev{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    flex-shrink: 0;
    transition: transform .15s ease;
    line-height: 1.5;
  }
  .qa-item.open .qa-q .chev{ transform: rotate(90deg); }
  .qa-a{
    display: none;
    padding: 0 16px 16px 40px;
  }
  .qa-item.open .qa-a{ display: block; }
  .qa-a p{
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .qa-a p:last-child{ margin-bottom: 0; }
  .qa-a code{
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text);
  }

  /* ===== Pólya beat tags ===== */
  .beat-tag.entender{ color: var(--warn); }
  .beat-tag.simular{ color: #7a5aa8; }
  .beat-tag.escribir{ color: var(--accent); }
  .beat-tag.medir{ color: var(--ok); }
  .beat-tag.mirar{ color: var(--danger); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .beat-tag.simular{ color:#b39ddb; } }
  :root[data-theme="dark"] .beat-tag.simular{ color:#b39ddb; }
  @media (max-width: 640px){
    .beat{ grid-template-columns: 1fr; gap: 6px; }
  }

  .polya{ display:flex; flex-wrap:wrap; gap:6px; margin: 4px 0 22px; }
  .polya span{ font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
    border:1px solid var(--line-soft); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
  .polya .entender{ color: var(--warn); } .polya .simular{ color:#7a5aa8; } .polya .escribir{ color: var(--accent); }
  .polya .medir{ color: var(--ok); } .polya .mirar{ color: var(--danger); }

  /* ===== Tables ===== */
  .tbl-wrap{ overflow-x:auto; margin: 10px 0 8px; border:1px solid var(--line-soft); border-radius: 8px; background: var(--surface); }
  table.tbl{ border-collapse: collapse; width:100%; font-size: 13px; }
  table.tbl th, table.tbl td{ padding: 7px 12px; text-align:left; border-bottom:1px solid var(--line-soft); white-space: nowrap; }
  table.tbl th{ font-family: var(--mono); font-size: 10.5px; letter-spacing:.05em; text-transform: uppercase; color: var(--text-faint); background: var(--surface-2); }
  table.tbl td{ color: var(--text-dim); font-variant-numeric: tabular-nums; }
  table.tbl td.n{ font-family: var(--mono); color: var(--text); }
  table.tbl tr:last-child td{ border-bottom: none; }
  table.tbl tr.weak td{ color: var(--danger); }

  /* ===== Honesty box ===== */
  .caveat{ background: var(--danger-soft); border-left: 3px solid var(--danger); border-radius: 0 7px 7px 0; padding: 12px 16px; margin: 10px 0 8px; }
  .caveat h4{ margin:0 0 6px; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color: var(--danger); font-weight:700; }
  .caveat p{ margin:0 0 6px; font-size:13.5px; line-height:1.6; color: var(--text); }
  .caveat p:last-child{ margin-bottom:0; }
  .caveat code, .beat-body li code{ font-family: var(--mono); font-size:.9em; background: var(--surface-2); padding:1px 5px; border-radius:4px; }
  .beat-body ul{ margin: 4px 0 8px; padding-left: 18px; color: var(--text-dim); font-size: 14px; line-height: 1.65; }

  /* ===== Pitch (summary panel) ===== */
  .pitch{ background: var(--surface); border:1px solid var(--line-soft); border-radius: 10px; padding: 18px 20px; margin: 0 0 24px; }
  .pitch p{ margin: 0 0 10px; font-size: 15px; line-height: 1.7; color: var(--text); }
  .pitch p:last-child{ margin-bottom: 0; }
  .pitch .lbl{ font-family: var(--mono); font-size: 10.5px; letter-spacing:.08em; text-transform: uppercase; color: var(--accent); display:block; margin-bottom: 8px; }

  /* ===== SVG text classes ===== */
  .fig-card svg{ color: var(--text-dim); }
  .s-box{ fill: var(--surface-2); stroke: var(--line); }

<script>
/* ===== Content helpers ===== */
let figCounter = 0;
function fig(svgInner, viewBox, caption, ariaLabel){
  figCounter++;
  const mid = `arrow-fig-${figCounter}`;
  const withIds = svgInner.replace(/url\(#arrow\)/g, `url(#${mid})`);
  return `<figure class="fig"><div class="fig-card">
      <svg viewBox="${viewBox}" role="img" aria-label="${ariaLabel}">
        <defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
        ${withIds}
      </svg></div><figcaption>${caption}</figcaption></figure>`;
}
function code(fname, label, body){
  return `<div class="code-panel"><div class="code-panel-head"><span class="fname">${fname}</span><span class="flabel">${label}</span></div>
    <div class="codeblock">${body}</div></div>`;
}
function explain(title, body){ return `<div class="explain-box"><h4>${title}</h4>${body}</div>`; }
function caveat(title, body){ return `<div class="caveat"><h4>${title}</h4>${body}</div>`; }
function table(head, rows, weakRows = []){
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="${weakRows.includes(i) ? 'weak' : ''}">${r.map((c, j) => `<td class="${j > 0 ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function stats(items){
  return `<div class="stat-row">${items.map(s => `<div class="stat ${s.good ? 'good' : ''}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`).join('')}</div>`;
}
/* Shared SVG figures (language-neutral parts) */
function pipelineSvg(labels){
  // labels: [[title, desc] x5]
  return labels.map(([t, d], i) => {
    const x = 20 + i * 196;
    return `<rect class="s-box" x="${x}" y="24" width="168" height="62" rx="7"/>
      <text class="s-t" x="${x + 84}" y="50" text-anchor="middle">${t}</text>
      <text class="s-d" x="${x + 84}" y="70" text-anchor="middle">${d}</text>
      ${i < labels.length - 1 ? `<line class="s-line" x1="${x + 168}" y1="55" x2="${x + 192}" y2="55" marker-end="url(#arrow)"/>` : ''}`;
  }).join('');
}

    {q:'Tu primer modelo tiene un mAP50 del 98.7%. ¿Te lo crees?', a:`<p>No del todo. Los frames vienen de un único vídeo y el split es aleatorio frame a frame, así que en validación hay frames casi idénticos a los de entrenamiento. Es fuga de datos. El número dice que el modelo reconoce ese vídeo, no que funcione en otro. Para creérmelo haría un split por bloques temporales y probaría con otra grabación.</p>`},
    {q:'Subiste el umbral de confianza de 0.25 a 0.65. ¿Qué coste tiene?', a:`<p>Menos falsos positivos a cambio de menos recall: los pilares reales con confianza entre 0.25 y 0.65 dejan de detectarse. En un sistema de seguridad para peatones, perder un obstáculo real es peor que un aviso de más. Lo correcto sería elegir el umbral con la curva precision-recall en validación y atacar la causa con ejemplos negativos, no fijarlo a ojo.</p>`},
    {q:'Añadiste 59 frames de pilares invertidos y el mAP50-95 no cambió. ¿Cómo lo interpretas?', a:`<p>Una métrica agregada puede esconder el subgrupo que te importa. Si la validación tiene pocos pilares invertidos, mejorar en ellos casi no mueve la media. Lo que falta es evaluar ese subconjunto por separado. No lo hice, y es una de las lecciones que me llevo.</p>`}

{

    {tag:'entender', h:'El cuello de botella eran las etiquetas, no el modelo', body:`<p>Entrenar YOLO es un comando. Conseguir miles de cajas bien puestas es semanas de trabajo. Si un modelo <em>zero-shot</em> (que detecta clases que no ha visto, guiado por texto) propone las cajas y una persona solo revisa, el coste baja un orden de magnitud.</p>`},

    ${explain('La conversión a mano, con números', `<p>Caja en píxeles <code>(x1, y1, x2, y2) = (400, 200, 560, 520)</code> en una imagen de 1280×720. YOLO quiere el centro y el tamaño normalizados entre 0 y 1:</p>
    <p><code>cx = (400+560)/2/1280 = 0.375</code> · <code>cy = (200+520)/2/720 = 0.500</code> · <code>w = 160/1280 = 0.125</code> · <code>h = 320/720 = 0.444</code></p>
    <p>Si normalizas con el ancho donde tocaba el alto, las cajas salen desplazadas y el entrenamiento no da error: aprende basura en silencio. Por eso existe <code>visualize_annotations.py</code>.</p>`)}`},
    {tag:'escribir', h:'El núcleo del anotador', body:`${code('src/annotation.py','AutoAnnotator.annotate_image', [
      '<span class="c1"># Grounding DINO separa frases por punto</span>',
      'prompt = prompt <span class="kw">if</span> prompt.endswith(<span class="str">"."</span>) <span class="kw">else</span> prompt + <span class="str">"."</span>',
      '',

      '    outputs = <span class="kw">self</span>.model(**inputs)',
      '',
      'results = <span class="kw">self</span>.processor.post_process_grounded_object_detection(',
      '    outputs, input_ids=inputs.input_ids, target_sizes=[(height, width)])[<span class="num">0</span>]',
      '',
      'mask = results[<span class="str">"scores"</span>] >= threshold      <span class="c1"># 0.3 por defecto</span>',
      'boxes = results[<span class="str">"boxes"</span>][mask].cpu().numpy()'

    <p><strong>Decisión:</strong> cargar el modelo con Hugging Face <code>transformers</code> en vez de compilar el repo original. Instalarlo es trivial y la dependencia queda como <em>extra</em> opcional (<code>uv sync --extra annotation</code>).</p>`,
    chips:['a6bf6ad YOLO-World','6b5a4a7 Grounding DINO']},
    {tag:'medir', h:'Mismo conjunto, dos modelos', body:`${table(['Métrica (47 imágenes)','YOLO-World','Grounding DINO'],[

      ['Detecciones totales','6','259'],
      ['Rango de confianza','0.05–0.09','0.25–0.69'],

    <p>Con YOLO-World, prompts como <code>"yellow black checkered cube"</code> o <code>"yellow box"</code> dieron cero detecciones. Mi hipótesis, no verificada: su parte de lenguaje (CLIP) se entrenó con fotos reales y le cuesta con texturas sintéticas de VR.</p>`},
    {tag:'mirar', h:'Detectar mucho no es detectar bien', body:`${caveat('Lo que la tabla no dice', `<p>"100% de cobertura" y "259 detecciones" miden <strong>cantidad</strong>, no si las cajas eran correctas. Salen 5.5 detecciones por imagen y nunca comparé con un conjunto etiquetado a mano, así que no sé cuántas eran falsas. En el diario escribí "43 veces mejor", y esa frase compara conteos, no calidad.</p>`)}
    <ul>
      <li><strong>Qué haría:</strong> etiquetar a mano unas 50 imágenes como <em>gold set</em> y medir precisión y recall del anotador con varios umbrales antes de fiarme de él.</li>

      <li><strong>El riesgo de fondo:</strong> si entrenas con etiquetas de otro modelo, heredas sus errores sistemáticos. Lo que falle el anotador, el detector aprenderá a fallarlo.</li>

  qa: [
    {q:'¿Cómo sabes que las anotaciones automáticas son buenas?', a:`<p>Con este proyecto, solo por inspección visual y la revisión con <code>review_annotations.py</code>. No es suficiente. Lo riguroso es un <em>gold set</em> etiquetado a mano y medir precisión y recall del anotador contra él, eligiendo el umbral según esa curva. Es lo primero que añadiría.</p>`},
    {q:'YOLO-World es 12 veces más rápido. ¿Por qué no usarlo?', a:`<p>Porque en este dominio no detectaba casi nada: 8.5% de las imágenes con confianzas por debajo de 0.1. La velocidad no importa si la salida no sirve, y además anotar es un proceso offline. Si fuera inferencia en tiempo real, el trade-off sería otro.</p>`},
    {q:'¿Qué riesgo tiene entrenar un detector con etiquetas generadas por otro modelo?', a:`<p>Que copia sus errores. Si Grounding DINO no ve pilares pequeños o a contraluz, esos casos entran como fondo y el detector aprende a ignorarlos. Se mitiga con revisión humana, un gold set para medir al anotador y añadiendo a mano los casos difíciles.</p>`}

},

{

  title: 'TensorRT FP16, y cómo se mide para que el número signifique algo',
  sub: 'El modelo corre junto a otros (profundidad, mirada) en la misma GPU, así que cada milisegundo cuenta. Exportar a TensorRT es fácil. Medir bien es la parte donde es fácil equivocarse.',
  beats: [
    {tag:'entender', h:'Presupuesto de latencia, no FPS de folleto', body:`<p>En AriaGuard el detector comparte GPU con otros modelos. Importa cuántos milisegundos consume por frame y lo estable que es, más que el pico de FPS. TensorRT compila el modelo para una GPU concreta: fusiona capas, elige kernels y usa FP16.</p>`},

      <line x1="16" y1="196" x2="380" y2="196" style="stroke:var(--ok)" stroke-width="2"/><text class="s-ok" x="390" y="200">reloj parado cuando la GPU termina → real</text>
    `, '0 0 700 214', 'Ilustrativo. Las llamadas a la GPU son asíncronas: Python vuelve en cuanto el trabajo está encolado. Sin sincronizar, el cronómetro mide lo que tarda en encolarse, no la inferencia.', 'Línea de tiempo CPU y GPU con y sin sincronización')}
    <p>El <strong>warmup</strong> resuelve el problema contrario. Las primeras llamadas incluyen cargar el engine, reservar memoria y ajustar kernels, y pueden tardar cientos de ms. Si entran en la media, la inflan.</p>`},
    {tag:'escribir', h:'El bucle de medida', body:`${code('scripts/benchmark.py','benchmark_model', [
      'dummy_img = np.random.randint(<span class="num">0</span>, <span class="num">255</span>, (imgsz, imgsz, <span class="num">3</span>), dtype=np.uint8)',

      'torch.cuda.synchronize()',
      '',
      '<span class="kw">for</span> _ <span class="kw">in</span> range(iterations):',
      '    start = time.perf_counter()',
      '    model(dummy_img, verbose=<span class="kw">False</span>)',
      '    torch.cuda.synchronize()               <span class="c1"># esperar a la GPU antes de parar el reloj</span>',

      '',
      '<span class="kw">return</span> {<span class="str">"mean"</span>: ..., <span class="str">"std"</span>: ..., <span class="str">"median"</span>: ..., <span class="str">"fps"</span>: <span class="num">1000</span> / np.mean(times_ms)}'

    <p>Export: <code>uv run python scripts/export_tensorrt.py --format engine --half</code>.</p>`},
    {tag:'medir', h:'YOLO26m en RTX 5060 Ti (200 iteraciones, 20 de warmup)', body:`${table(['Formato','Media','Std','FPS','vs PyTorch'],[
      ['PyTorch','8.86 ms','0.19 ms','112.9','1.0×'],
      ['ONNX (CPU, no válido)','177.06 ms','10.55 ms','5.6','—'],

    ${stats([{num:'2.9×', lbl:'más rápido que PyTorch', good:true},{num:'110 → 52 W', lbl:'potencia en pico'},{num:'451', lbl:'FPS · YOLO26s FP16 (nav)'}])}
    <p>En pico, TensorRT también consumió menos potencia: 52 W frente a 110 W, según <code>nvidia-smi dmon</code>.</p>`,
    chips:['6de1edd benchmark guide','6107f4e 451 FPS yolo26s_nav']},
    {tag:'mirar', h:'Qué no dice este benchmark', body:`${caveat('Límites del número', `<p><strong>Imagen de ruido aleatorio:</strong> no hay decodificación de cámara ni objetos reales, así que casi no hay detecciones. En un vídeo real el tiempo por frame será mayor.</p><p><strong>El 451 FPS no tiene procedimiento registrado.</strong> Aparece en las notas del proyecto, pero no hay comando, commit ni log que lo acompañe. El método documentado es el del 331 FPS (YOLO26m). Hoy no puedo reproducir exactamente ese 451.</p><p><strong>La fila ONNX es inválida:</strong> corrió en CPU porque faltaba <code>onnxruntime-gpu</code>. Compararla con las de GPU no tiene sentido.</p>`)}
    <ul>
      <li><strong>Solo media y std.</strong> Para un sistema de seguridad importa la cola: añadiría p95 y p99. AriaGuard lo hizo después.</li>
      <li><strong>No medí la precisión del engine FP16</strong> frente al <code>.pt</code>. FP16 suele perder muy poco, pero "suele" no es un dato. Correría <code>yolo val</code> con los dos.</li>

  qa: [
    {q:'¿Por qué llamas a torch.cuda.synchronize() dentro del bucle?', a:`<p>Porque las operaciones de GPU son asíncronas respecto a la CPU. Sin sincronizar, <code>perf_counter()</code> se para cuando el trabajo está encolado, no terminado, y mides tiempos irrealmente bajos. Sincronizar antes de parar el reloj asegura medir la inferencia completa.</p>`},
    {q:'¿Para qué sirve el warmup?', a:`<p>Las primeras inferencias incluyen costes únicos: cargar el engine, reservar memoria y ajustar kernels. Pueden tardar cientos de ms frente a ~3 ms en régimen estable. Si entran en la media la inflan, y como FPS = 1000/media, el error se propaga. Se ejecutan y se descartan.</p>`},
    {q:'¿TensorRT FP16 pierde precisión? ¿Lo mediste?', a:`<p>Puede perder un poco por redondeo en capas sensibles. En este repo no hay registro de haber comparado el mAP del <code>.engine</code> con el del <code>.pt</code>, así que no puedo afirmar nada. Es lo primero que haría antes de desplegar: <code>yolo val</code> con ambos sobre el mismo conjunto.</p>`}
  ]

  <div class="pitch">

    <p><strong>Problem.</strong> A blind pedestrian wearing camera glasses needs the system to detect doors, stairs, street lights or wheelchairs. Models pretrained on COCO don't know those classes.</p>
    <p><strong>What I built.</strong> A Python framework that covers the whole loop: auto-annotate images from text (Grounding DINO), train YOLO26, evaluate, export to TensorRT and benchmark. With it I trained <code>yolo26s_nav</code>, a 24-class model used by AriaGuard.</p>
    <p><strong>Honest result.</strong> It's fast (451 FPS with TensorRT FP16), but accuracy is modest: 0.47 mAP50. The classes that matter most for the product, like stairs, are among the weakest. I built it alone: 133 commits between December 2025 and September 2026.</p>

/* 1 · VR ORIGIN */
{
  id: 'origen', label: 'The origin: a VR detector', date: 'Dec 3–8, 2025 · d319f58 → ae29ec0',
  focus: ['datos','anotar','dataset','entrenar','evaluar'],
  title: 'First, a single object in a virtual world',
  sub: 'Before it was a framework, the project detected one object: pillars with a yellow-and-black checkerboard pattern inside an Unreal Engine scene. Almost every later problem showed up here first.',
  beats: [
    {tag:'entender', h:'One video, zero labels', body:`<p>The starting point was a video captured in VR and a cropped image of the pillar. Labeling hundreds of frames by hand was slow, and the classic tool, LabelImg, crashed on Python 3.12 (<code>drawLine(): argument 1 has unexpected type 'float'</code>).</p>
    <p>The real question wasn't how to train YOLO, but <strong>how to get labels without labeling by hand</strong>.</p>`},
    {tag:'simular', h:'Template matching on one frame', body:`<p>The idea: slide the pillar image (the template) across the frame and score how similar each position is. Where the score passes a threshold, you have a detection.</p>
    ${fig(`
      <rect class="s-box" x="20" y="20" width="250" height="140" rx="6"/>
      <text class="s-d" x="30" y="38">frame 1280×720</text>
      <rect x="70" y="60" width="44" height="80" rx="3" fill="none" style="stroke:var(--accent)" stroke-width="2"/>
      <rect x="180" y="60" width="44" height="80" rx="3" fill="none" style="stroke:var(--danger)" stroke-width="2" stroke-dasharray="4 3"/>
      <text class="s-ok" x="92" y="154" text-anchor="middle">0.93</text>
      <text class="s-bad" x="202" y="154" text-anchor="middle">0.74</text>
      <line class="s-line" x1="270" y1="90" x2="320" y2="90" marker-end="url(#arrow)"/>
      <rect class="s-box" x="325" y="30" width="250" height="44" rx="6"/>
      <text class="s-t" x="450" y="57" text-anchor="middle">threshold 0.70 → 2 hits</text>
      <rect class="s-box-ok" x="325" y="96" width="250" height="44" rx="6"/>
      <text class="s-t" x="450" y="123" text-anchor="middle">threshold 0.85 → 1 hit</text>
      <text class="s-bad" x="450" y="170" text-anchor="middle">repeating checkerboard → false positives</text>
    `, '0 0 600 180', 'Illustrative simulation with example values: the checkerboard repeats in places that aren\'t the pillar. At 0.70 those pass the filter; raising it to 0.85–0.95 removes them, at the cost of missing pillars seen at odd angles.', 'Template sliding over a frame with two scores and two thresholds')}
    <p>The same reasoning explains the next failure: an <strong>inverted</strong> pillar, black on top, barely resembles the normal template and never passes the threshold. It needed a second template.</p>`},
    {tag:'escribir', h:'One script per step, with a human reviewing', body:`<p>Each step is its own script. Human review (<code>review_annotations.py</code>) sits in the middle on purpose: auto-annotation proposes, a person decides.</p>
    ${fig(`
      ${pipelineSvg([['auto_annotate','template + NMS'],['visualize','inspect boxes'],['review','human accepts'],['split_dataset','80/20 seed 42'],['train · eval','YOLOv12s']])}
      <path class="s-line" d="M 694 86 C 694 130, 104 130, 104 90" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text class="s-bad" x="400" y="126" text-anchor="middle">inverted pillars missed → new template → re-annotate</text>
    `, '0 0 1000 140', 'The first version\'s flow. The return arrow is the real loop I had to go through when the model missed inverted pillars.', 'Five-script pipeline with a feedback loop')}
    ${code('scripts/split_dataset.py','train/val split', [
      '<span class="kw">def</span> <span class="fn">split_pairs</span>(pairs, train_ratio=<span class="num">0.8</span>, seed=<span class="num">42</span>):',
      '    random.seed(seed)',
      '    shuffled = pairs.copy()',
      '    random.shuffle(shuffled)          <span class="c1"># ← frames from ONE video, shuffled</span>',
      '    split_idx = int(len(shuffled) * train_ratio)',
      '    <span class="kw">return</span> shuffled[:split_idx], shuffled[split_idx:]'
    ].join('\n'))}`,
    chips:['0ec9c97 auto-annotate template matching','f83a122 review_annotations','699d080 evaluate, export, benchmark']},
    {tag:'medir', h:'Four training runs', body:`${table(['#','Model','Data','mAP50-95','Note'],[
      ['1','YOLOv8n · 10 ep.','555 train','62.7%','baseline'],
      ['2','YOLOv12s · 50 ep.','555 train','84.7%','+22 points from a bigger model'],
      ['3','YOLOv12s · 100 ep.','+7 inverted','87.4%','not enough'],
      ['4','YOLOv12s · 100 ep.','+59 inverted','87.4%','final']
    ])}
    ${stats([{num:'98.7%', lbl:'final mAP50'},{num:'99.2%', lbl:'recall'},{num:'71 → 180', lbl:'FPS PyTorch → TensorRT', good:true},{num:'RTX 2060', lbl:'6 GB'}])}
    <p>The model produced "ghost" detections at 0.50–0.55 confidence, so I raised the inference threshold from 0.25 to 0.65.</p>`,
    chips:['9d30375 TensorRT 180 FPS']},
    {tag:'mirar', h:'That 98.7% is optimistic', body:`${caveat('Train/val leakage', `<p>Every frame comes from the same video and <code>split_pairs</code> shuffles them randomly. Consecutive frames are nearly identical, so the model was very likely validated on images it had practically seen in training. The 98.7% measures memory of that video, not generalization.</p><p><strong>What I'd do today:</strong> split by time blocks or scenes, never frame by frame.</p>`)}
    <ul>
      <li><strong>Adding 59 inverted frames didn't move mAP50-95</strong> (87.4% → 87.4%). Either validation had almost no inverted pillars, or the aggregate metric hid the case that mattered. I didn't check; I should have measured that subset on its own.</li>
      <li><strong>Raising the threshold to 0.65 is a patch</strong>: it removes ghosts, and also real detections. The real fix is adding hard negative examples.</li>
      <li><strong>What worked:</strong> auto-annotation plus human review. That idea survives through the whole project.</li>
    </ul>`}
  ],
  qa: [
    {q:'Your first model has 98.7% mAP50. Do you believe it?', a:`<p>Not really. The frames come from one video and the split is random frame by frame, so validation contains frames nearly identical to training ones. That's leakage. The number says the model recognizes that video, not that it works on another. To trust it I'd split by time blocks and test on a different recording.</p>`},
    {q:'You raised the confidence threshold from 0.25 to 0.65. What does that cost?', a:`<p>Fewer false positives for lower recall: real pillars scoring between 0.25 and 0.65 stop being detected. In a pedestrian safety system, missing a real obstacle is worse than an extra warning. The right move is to pick the threshold from the validation precision-recall curve and fix the cause with negative examples, not set it by eye.</p>`},
    {q:'You added 59 inverted-pillar frames and mAP50-95 didn\'t change. How do you read that?', a:`<p>An aggregate metric can hide the subgroup you care about. If validation has few inverted pillars, improving on them barely moves the average. What was missing is evaluating that subset separately. I didn't, and it's one of the lessons I took away.</p>`}
  ]
},

/* 2 · ZERO-SHOT */
{
  id: 'zeroshot', label: 'Annotating without annotating', date: 'Dec 15, 2025 · a6bf6ad, 6b5a4a7',
  focus: ['anotar'],
  title: 'Describe the object in text instead of cropping it',
  sub: 'With template matching, every new look of the object needs another template, and that doesn\'t scale. So I tried models that detect from a sentence: YOLO-World failed and Grounding DINO worked.',
  beats: [
    {tag:'entender', h:'The bottleneck was labels, not the model', body:`<p>Training YOLO is one command. Getting thousands of correct boxes is weeks of work. If a <em>zero-shot</em> model (one that detects unseen classes guided by text) proposes the boxes and a person only reviews, the cost drops by an order of magnitude.</p>`},
    {tag:'simular', h:'One image, end to end', body:`${fig(`
      <rect class="s-box" x="16" y="20" width="170" height="44" rx="6"/><text class="s-t" x="101" y="47" text-anchor="middle">image 1280×720</text>
      <rect class="s-box" x="16" y="80" width="170" height="44" rx="6"/><text class="s-t" x="101" y="100" text-anchor="middle">"yellow and black</text><text class="s-t" x="101" y="115" text-anchor="middle">checkered box."</text>
      <line class="s-line" x1="186" y1="42" x2="226" y2="66" marker-end="url(#arrow)"/><line class="s-line" x1="186" y1="102" x2="226" y2="80" marker-end="url(#arrow)"/>
      <rect class="s-box-ok" x="230" y="46" width="150" height="54" rx="6"/><text class="s-t" x="305" y="70" text-anchor="middle">Grounding DINO</text><text class="s-d" x="305" y="88" text-anchor="middle">tiny · transformers</text>
      <line class="s-line" x1="380" y1="73" x2="415" y2="73" marker-end="url(#arrow)"/>
      <rect class="s-box" x="418" y="46" width="150" height="54" rx="6"/><text class="s-t" x="493" y="68" text-anchor="middle">boxes + scores</text><text class="s-d" x="493" y="86" text-anchor="middle">score ≥ 0.30</text>
      <line class="s-line" x1="568" y1="73" x2="603" y2="73" marker-end="url(#arrow)"/>
      <rect class="s-box" x="606" y="46" width="260" height="54" rx="6"/><text class="s-t" x="736" y="68" text-anchor="middle">0 0.375 0.500 0.125 0.444</text><text class="s-d" x="736" y="86" text-anchor="middle">YOLO line: class cx cy w h</text>
    `, '0 0 880 140', 'One image through the flow. The prompt ends with a period because Grounding DINO splits phrases on periods.', 'Image and text go into Grounding DINO, boxes come out, get filtered and converted to YOLO format')}
    ${explain('The conversion by hand, with numbers', `<p>Pixel box <code>(x1, y1, x2, y2) = (400, 200, 560, 520)</code> in a 1280×720 image. YOLO wants center and size normalized to 0–1:</p>
    <p><code>cx = (400+560)/2/1280 = 0.375</code> · <code>cy = (200+520)/2/720 = 0.500</code> · <code>w = 160/1280 = 0.125</code> · <code>h = 320/720 = 0.444</code></p>
    <p>Normalize by width where height belongs and the boxes shift, yet training throws no error: it silently learns garbage. That's why <code>visualize_annotations.py</code> exists.</p>`)}`},
    {tag:'escribir', h:'The core of the annotator', body:`${code('src/annotation.py','AutoAnnotator.annotate_image', [
      '<span class="c1"># Grounding DINO splits phrases on periods</span>',
      'prompt = prompt <span class="kw">if</span> prompt.endswith(<span class="str">"."</span>) <span class="kw">else</span> prompt + <span class="str">"."</span>',
      '',
      'inputs = <span class="kw">self</span>.processor(images=pil_image, text=prompt, return_tensors=<span class="str">"pt"</span>).to(<span class="kw">self</span>.device)',
      '<span class="kw">with</span> torch.no_grad():',
      '    outputs = <span class="kw">self</span>.model(**inputs)',
      '',
      'results = <span class="kw">self</span>.processor.post_process_grounded_object_detection(',
      '    outputs, input_ids=inputs.input_ids, target_sizes=[(height, width)])[<span class="num">0</span>]',
      '',
      'mask = results[<span class="str">"scores"</span>] >= threshold      <span class="c1"># 0.3 by default</span>',
      'boxes = results[<span class="str">"boxes"</span>][mask].cpu().numpy()'
    ].join('\n'))}
    <p><strong>Decision:</strong> load the model through Hugging Face <code>transformers</code> instead of building the original repo. Installing is trivial and the dependency stays an optional <em>extra</em> (<code>uv sync --extra annotation</code>).</p>`,
    chips:['a6bf6ad YOLO-World','6b5a4a7 Grounding DINO']},
    {tag:'medir', h:'Same images, two models', body:`${table(['Metric (47 images)','YOLO-World','Grounding DINO'],[
      ['Images with any detection','8.5%','100%'],
      ['Total detections','6','259'],
      ['Confidence range','0.05–0.09','0.25–0.69'],
      ['Speed','~25 img/s','~2 img/s']
    ])}
    <p>With YOLO-World, prompts like <code>"yellow black checkered cube"</code> or <code>"yellow box"</code> returned zero detections. My hypothesis, not verified: its language side (CLIP) was trained on real photos and struggles with synthetic VR textures.</p>`},
    {tag:'mirar', h:'Detecting a lot is not detecting well', body:`${caveat('What the table does not say', `<p>"100% coverage" and "259 detections" measure <strong>quantity</strong>, not whether the boxes were right. That's 5.5 detections per image, and I never compared against a hand-labeled set, so I don't know how many were false. My diary said "43× better", which compares counts, not quality.</p>`)}
    <ul>
      <li><strong>What I'd do:</strong> hand-label about 50 images as a <em>gold set</em> and measure the annotator's precision and recall at several thresholds before trusting it.</li>
      <li><strong>The speed trade-off was acceptable</strong>: 12× slower, but annotation is an offline job done once.</li>
      <li><strong>The underlying risk:</strong> train on labels from another model and you inherit its systematic errors. Whatever the annotator misses, the detector learns to miss.</li>
    </ul>`}
  ],
  qa: [
    {q:'How do you know the automatic annotations are good?', a:`<p>In this project, only by visual inspection and review with <code>review_annotations.py</code>. That isn't enough. The rigorous way is a hand-labeled <em>gold set</em>, measuring the annotator's precision and recall against it and choosing the threshold from that curve. It's the first thing I'd add.</p>`},
    {q:'YOLO-World is 12× faster. Why not use it?', a:`<p>Because in this domain it detected almost nothing: 8.5% of images, with confidence below 0.1. Speed doesn't matter if the output is useless, and annotation runs offline anyway. For real-time inference the trade-off would be different.</p>`},
    {q:'What\'s the risk of training a detector on labels produced by another model?', a:`<p>It copies that model's mistakes. If Grounding DINO misses small or backlit pillars, those cases become background and the detector learns to ignore them. You mitigate it with human review, a gold set to measure the annotator, and hand-adding the hard cases.</p>`}
  ]
},

    <p>I also moved from <code>pip</code> to <code>uv</code>, with <code>pyproject.toml</code> and optional extras, so heavy dependencies (transformers, FiftyOne) only install when used.</p>`,

    {tag:'medir', h:'A bug the UI couldn\'t show', body:`<p>After a PyTorch update, the UI always showed "GPU: Not available" on a machine with a GPU. The memory attribute the code read didn't exist in that version. The <code>except Exception</code> swallowed the <code>AttributeError</code> and quietly returned "no GPU".</p>

      '<span class="c1">- vram_mb = torch.cuda.get_device_properties(0).total_mem // (1024 * 1024)</span>',

    <ul>

    {q:'Why separate src/ from app.py and scripts/?', a:`<p>To have a single implementation of each thing and be able to test it. Before, training from the UI and from the CLI were two paths that could diverge. Now both call <code>src/</code>. And <code>src/</code> imports without loading Gradio, which makes tests fast and CI-friendly.</p>`},

/* 4 · COMBINED DATASET */
{
  id: 'dataset', label: '24 classes without forgetting COCO', date: 'Feb 20–21, 2026 · 39d1a9e, 6107f4e, 8883995',
  focus: ['datos','dataset','entrenar','evaluar'],
  title: 'You can\'t add classes to YOLO: you retrain with all of them',
  sub: 'Assisted navigation needed doors, stairs, street lights, traffic signs, trees and wheelchairs, without losing people, cars or bikes. This phase is the technical core of the project.',
  beats: [
    {tag:'entender', h:'The detection head gets replaced entirely', body:`<p>YOLO's last layer has one output per class. Train with 6 classes and the head has 6 outputs: the model <strong>forgets COCO's 80</strong>. Freezing the backbone (<code>freeze</code>) keeps the features, not the classes.</p>
    <p>So the final model has to be trained on <strong>all classes at once</strong>, in a single dataset.</p>`},
    {tag:'simular', h:'Follow one label into the final dataset', body:`${fig(`
      <rect class="s-box" x="16" y="16" width="300" height="74" rx="7"/>
      <text class="s-t" x="166" y="38" text-anchor="middle">COCO subset · FiftyOne</text>
      <text class="s-d" x="166" y="56" text-anchor="middle">18 classes · IDs 0–17 · 8,000 / 2,000</text>
      <text class="s-ok" x="166" y="76" text-anchor="middle">person → 0 (list order)</text>
      <rect class="s-box" x="16" y="116" width="300" height="74" rx="7"/>
      <text class="s-t" x="166" y="138" text-anchor="middle">nav_custom · Open Images V7</text>

/* 5 · SPEED */
{
  id: 'velocidad', label: 'Measuring speed honestly', date: 'Feb 20–21, 2026 · 6de1edd, 6107f4e',
  focus: ['exportar','verificar'],
  title: 'TensorRT FP16, and how to measure it so the number means something',
  sub: 'The model shares the GPU with others (depth, gaze), so every millisecond counts. Exporting to TensorRT is easy. Measuring correctly is where it\'s easy to get it wrong.',
  beats: [
    {tag:'entender', h:'A latency budget, not brochure FPS', body:`<p>In AriaGuard the detector shares the GPU with other models. What matters is how many milliseconds it uses per frame and how stable that is, more than peak FPS. TensorRT compiles the model for one specific GPU: it fuses layers, picks kernels and uses FP16.</p>`},
    {tag:'simular', h:'One benchmark iteration, with and without syncing', body:`${fig(`
      <text class="s-d" x="16" y="22">without torch.cuda.synchronize()</text>
      <rect class="s-box" x="16" y="30" width="60" height="22" rx="3"/><text class="s-d" x="46" y="45" text-anchor="middle">CPU</text>
      <rect class="s-box-bad" x="80" y="58" width="300" height="22" rx="3"/><text class="s-bad" x="230" y="73" text-anchor="middle">GPU still working…</text>
      <line x1="16" y1="90" x2="80" y2="90" style="stroke:var(--danger)" stroke-width="2"/><text class="s-bad" x="90" y="94">clock stops here → "0.4 ms" = wrong</text>
      <text class="s-d" x="16" y="128">with synchronize()</text>
      <rect class="s-box" x="16" y="136" width="60" height="22" rx="3"/><text class="s-d" x="46" y="151" text-anchor="middle">CPU</text>
      <rect class="s-box-ok" x="80" y="164" width="300" height="22" rx="3"/><text class="s-ok" x="230" y="179" text-anchor="middle">GPU working…</text>
      <line x1="16" y1="196" x2="380" y2="196" style="stroke:var(--ok)" stroke-width="2"/><text class="s-ok" x="390" y="200">clock stops when the GPU is done → real</text>
    `, '0 0 700 214', 'Illustrative. GPU calls are asynchronous: Python returns as soon as the work is queued. Without syncing, the timer measures queuing, not inference.', 'CPU and GPU timeline with and without synchronization')}
    <p><strong>Warmup</strong> solves the opposite problem. The first calls include loading the engine, allocating memory and tuning kernels, and can take hundreds of ms. If they land in the mean, they inflate it.</p>`},
    {tag:'escribir', h:'The measurement loop', body:`${code('scripts/benchmark.py','benchmark_model', [
      'dummy_img = np.random.randint(<span class="num">0</span>, <span class="num">255</span>, (imgsz, imgsz, <span class="num">3</span>), dtype=np.uint8)',
      '',
      '<span class="kw">for</span> _ <span class="kw">in</span> range(warmup):                 <span class="c1"># run and discard</span>',
      '    model(dummy_img, verbose=<span class="kw">False</span>)',
      'torch.cuda.synchronize()',
      '',
      '<span class="kw">for</span> _ <span class="kw">in</span> range(iterations):',
      '    start = time.perf_counter()',
      '    model(dummy_img, verbose=<span class="kw">False</span>)',
      '    torch.cuda.synchronize()               <span class="c1"># wait for the GPU before stopping the clock</span>',
      '    times.append(time.perf_counter() - start)',
      '',
      '<span class="kw">return</span> {<span class="str">"mean"</span>: ..., <span class="str">"std"</span>: ..., <span class="str">"median"</span>: ..., <span class="str">"fps"</span>: <span class="num">1000</span> / np.mean(times_ms)}'
    ].join('\n'))}
    <p>Export: <code>uv run python scripts/export_tensorrt.py --format engine --half</code>.</p>`},
    {tag:'medir', h:'YOLO26m on RTX 5060 Ti (200 iterations, 20 warmup)', body:`${table(['Format','Mean','Std','FPS','vs PyTorch'],[
      ['PyTorch','8.86 ms','0.19 ms','112.9','1.0×'],
      ['ONNX (CPU, not valid)','177.06 ms','10.55 ms','5.6','—'],
      ['TensorRT FP16','3.02 ms','0.03 ms','331.3','2.9×']
    ], [1])}
    ${stats([{num:'2.9×', lbl:'faster than PyTorch', good:true},{num:'110 → 52 W', lbl:'peak power'},{num:'451', lbl:'FPS · YOLO26s FP16 (nav)'}])}
    <p>At peak, TensorRT also drew less power: 52 W versus 110 W, according to <code>nvidia-smi dmon</code>.</p>`,
    chips:['6de1edd benchmark guide','6107f4e 451 FPS yolo26s_nav']},
    {tag:'mirar', h:'What this benchmark does not tell you', body:`${caveat('Limits of the number', `<p><strong>Random-noise image:</strong> no camera decoding and no real objects, so almost no detections. On real video the per-frame time will be higher.</p><p><strong>The 451 FPS has no recorded procedure.</strong> It appears in the project notes, but no command, commit or log comes with it. The documented method is the one behind 331 FPS (YOLO26m). Today I can't reproduce that 451 exactly.</p><p><strong>The ONNX row is invalid:</strong> it ran on CPU because <code>onnxruntime-gpu</code> was missing. Comparing it to the GPU rows makes no sense.</p>`)}
    <ul>
      <li><strong>Mean and std only.</strong> For a safety system the tail matters: I'd add p95 and p99. AriaGuard did that later.</li>
      <li><strong>I didn't measure the FP16 engine's accuracy</strong> against the <code>.pt</code>. FP16 usually loses very little, but "usually" isn't data. I'd run <code>yolo val</code> on both.</li>
      <li><strong>Desktop GPU</strong>, not the target Jetson.</li>
      <li><strong>Rule I took away:</strong> every number ships with its command, commit and hardware.</li>
    </ul>`}
  ],
  qa: [
    {q:'Why call torch.cuda.synchronize() inside the loop?', a:`<p>Because GPU operations are asynchronous relative to the CPU. Without syncing, <code>perf_counter()</code> stops when the work is queued, not finished, and you measure unrealistically low times. Syncing before stopping the clock ensures you measure the full inference.</p>`},
    {q:'What is the warmup for?', a:`<p>The first inferences include one-off costs: loading the engine, allocating memory and tuning kernels. They can take hundreds of ms versus ~3 ms steady-state. If they land in the mean they inflate it, and since FPS = 1000/mean, the error carries straight through. You run them and discard them.</p>`},
    {q:'Does TensorRT FP16 lose accuracy? Did you measure it?', a:`<p>It can lose a little from rounding in sensitive layers. There's no record in this repo of comparing the <code>.engine</code>'s mAP to the <code>.pt</code>'s, so I can't claim anything. It's the first thing I'd do before deploying: <code>yolo val</code> with both on the same set.</p>`}
  ]
},

/* Global map: the whole system, with this phase's part highlighted (zoom out ↔ zoom in) */
function renderMap(stepIdx, focus){
  const m = PAGE.map[currentLang], t = PAGE.ui[currentLang];
  const on = id => focus === 'all' || (focus || []).includes(id);
  const W = 124, G = 18, X0 = 14;
  const nodes = m.nodes.map((n, i) => {
    const x = X0 + i * (W + G);
    return `<g class="map-node ${on(n.id) ? 'm-on' : 'm-off'}" data-node="${n.id}" tabindex="0" role="button" aria-label="${n.t}">
      <rect x="${x}" y="14" width="${W}" height="52" rx="7"/>
      <text class="mt" x="${x + W/2}" y="37" text-anchor="middle">${n.t}</text>
      <text class="md" x="${x + W/2}" y="54" text-anchor="middle">${n.d}</text></g>
      ${i < m.nodes.length - 1 ? `<line class="s-line" x1="${x + W}" y1="40" x2="${x + W + G - 3}" y2="40" marker-end="url(#arrow-map-${stepIdx})"/>` : ''}`;
  }).join('');
  const total = m.nodes.length * W + (m.nodes.length - 1) * G;
  const bw = (total - G) / 2;
  const bands = m.bands.map((b, i) => {
    const x = X0 + i * (bw + G);
    return `<g class="map-node ${on(b.id) ? 'm-on' : 'm-off'}" data-node="${b.id}" tabindex="0" role="button" aria-label="${b.t}">
      <rect x="${x}" y="84" width="${bw}" height="32" rx="7" stroke-dasharray="4 3"/>
      <text class="mt" x="${x + bw/2}" y="104" text-anchor="middle">${b.t} <tspan class="md">· ${b.d}</tspan></text></g>`;
  }).join('');
  return `<figure class="fig map"><div class="fig-card map-card">
    <svg viewBox="0 0 ${total + 2*X0} 128" role="img" aria-label="${t.mapLabel}">
      <defs><marker id="arrow-map-${stepIdx}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      ${nodes}${bands}</svg></div>
    <figcaption>${t.mapCaption}</figcaption></figure>`;
}

function render(){
  const t = PAGE.ui[currentLang];
  const steps = activeSteps();
  const stepsEl = document.getElementById('steps');
  const panelsEl = document.getElementById('panels');
  stepsEl.innerHTML = ''; panelsEl.innerHTML = '';

  document.title = t.docTitle;
  document.documentElement.lang = currentLang;
  document.getElementById('rail').setAttribute('aria-label', t.railAria);
  document.getElementById('railEyebrow').textContent = t.railEyebrow;
  document.getElementById('railTitle').textContent = t.railTitle;
  document.getElementById('railFoot').innerHTML = t.railFoot;
  document.getElementById('railLinks').innerHTML = t.links.map(l => `<a href="${l.href}">${l.label}</a>`).join('');
  document.getElementById('langEs').className = currentLang === 'es' ? 'on' : '';
  document.getElementById('langEn').className = currentLang === 'en' ? 'on' : '';

  steps.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'step-item' + (i === current ? ' active' : '') + (i < current ? ' done' : '');
    li.innerHTML = `<button class="step-btn"><span class="step-dot"></span>
        <span class="step-num">${String(i).padStart(2,'0')} / ${String(steps.length-1).padStart(2,'0')}</span>
        <div class="step-label">${s.label}</div></button>`;
    li.querySelector('button').addEventListener('click', () => go(i));
    stepsEl.appendChild(li);

    const panel = document.createElement('section');
    panel.className = 'panel' + (i === current ? ' active' : '');
    panel.id = 'panel-' + s.id;
    const kicker = i === 0 ? t.summaryKicker : `${t.phase} ${i}`;
    panel.innerHTML = `
      <p class="kicker">${kicker} <span class="date">· ${s.date}</span></p>
      <h1 class="panel-title">${s.title}</h1>
      <p class="panel-sub">${s.sub}</p>
      ${renderMap(i, s.focus)}
      ${s.intro || ''}
      ${s.beats && s.beats.length ? `<div class="polya">${['entender','simular','escribir','medir','mirar'].map(k => `<span class="${k}">${t.tags[k]}</span>`).join('')}</div>` : ''}
      ${(s.beats || []).map(b => `
        <div class="beat">
          <div class="beat-tag ${b.tag}">${t.tags[b.tag]}</div>
          <div class="beat-body"><h3>${b.h}</h3>${b.body}
            ${b.chips ? `<div>${b.chips.map(c => { const [hash, ...rest] = c.split(' ');
              return `<span class="commit-chip"><span class="hash">${hash}</span>${rest.join(' ')}</span>`; }).join('')}</div>` : ''}
          </div>
        </div>`).join('')}
      ${renderQA(i, s.qa)}`;
    panelsEl.appendChild(panel);
  });

  panelsEl.querySelectorAll('.map-node').forEach(g => {
    const jump = () => { const id = g.dataset.node;
      const idx = activeSteps().findIndex((st, k) => k > 0 && Array.isArray(st.focus) && st.focus.includes(id));
      if (idx >= 0) go(idx); };
    g.addEventListener('click', jump);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(); } });
  });

  panelsEl.querySelectorAll('.fig').forEach(f => {
    const card = f.querySelector('.fig-card'); if (!card) return;
    const b = document.createElement('button');
    b.className = 'fig-zoom'; b.type = 'button'; b.textContent = '⤢ ' + t.zoom; b.setAttribute('aria-label', t.zoom);
    b.addEventListener('click', () => openLightbox(f));
    card.appendChild(b);
  });

  panelsEl.querySelectorAll('.qa-q').forEach(btn => btn.addEventListener('click', () => {
    const item = btn.parentElement; const open = item.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  }));

  const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');
  prev.textContent = t.prev; prev.disabled = current === 0;
  next.textContent = current === steps.length - 1 ? t.end : t.next; next.disabled = current === steps.length - 1;
  document.getElementById('progressText').textContent = t.progress(current, steps.length - 1);
  try { localStorage.setItem(KEY + '-step', String(current)); localStorage.setItem(KEY + '-lang', currentLang); } catch(e) {}
}

function openLightbox(figEl){
  const lb = document.getElementById('lightbox');
  const svg = figEl.querySelector('svg').cloneNode(true);
  const cap = figEl.querySelector('figcaption');
  lb.querySelector('.lb-card').replaceChildren(svg);
  lb.querySelector('.lb-cap').innerHTML = cap ? cap.innerHTML : '';
  lb.querySelector('.lb-close').textContent = PAGE.ui[currentLang].close;
  lb.hidden = false; lb.querySelector('.lb-close').focus();
  // clicking a map node inside the lightbox also jumps
  svg.querySelectorAll('.map-node').forEach(g => g.addEventListener('click', () => {
    closeLightbox(); const id = g.dataset.node;
    const idx = activeSteps().findIndex((st, k) => k > 0 && Array.isArray(st.focus) && st.focus.includes(id));
    if (idx >= 0) go(idx);
  }));
}
function closeLightbox(){ document.getElementById('lightbox').hidden = true; }

function go(i){
  if (i < 0 || i >= activeSteps().length) return;
  current = i; render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('langToggle').addEventListener('click', () => { currentLang = currentLang === 'es' ? 'en' : 'es'; render(); });
document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => go(current + 1));
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox' || e.target.classList.contains('lb-close')) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').hidden) { if (e.key === 'Escape') closeLightbox(); return; }
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(current + 1);
  if (e.key === 'ArrowLeft') go(current - 1);
});

(function init(){
  const params = new URLSearchParams(location.search);
  const qLang = params.get('lang');
  try {
    const savedLang = localStorage.getItem(KEY + '-lang');
    if (savedLang === 'es' || savedLang === 'en') currentLang = savedLang;
    else if ((navigator.language || '').slice(0,2) !== 'es') currentLang = 'en';
  } catch(e) {}
  if (qLang === 'es' || qLang === 'en') currentLang = qLang;
  try {
    const saved = localStorage.getItem(KEY + '-step');
    if (saved !== null) current = Math.min(parseInt(saved, 10) || 0, activeSteps().length - 1);
  } catch(e) {}
  render();
})();

</script>
</body>
</html>
