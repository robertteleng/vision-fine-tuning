<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cómo se construyó Vision Fine-Tuning</title>
<meta name="description" content="Bitácora técnica de vision-fine-tuning: fine-tuning de YOLO26 para navegación asistida, con código, métricas y límites. ES/EN.">
<meta property="og:title" content="How Vision Fine-Tuning was built">
<meta property="og:description" content="YOLO26 fine-tuning for assisted navigation: code, metrics and honest limits. ES/EN.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #e9edf1;
    --line: #c3ccd4;
    --line-soft: #d9dfe4;
    --text: #1b232c;
    --text-dim: #5b6773;
    --text-faint: #8894a0;
    --accent: #d9722c;
    --accent-2: #b3591f;
    --ok: #2f6f4f;
    --ok-soft: #dbeee1;
    --danger: #b3402c;
    --danger-soft: #f3ddd5;
    --warn: #3a5f8a;
    --code-bg: #171b1f;
    --code-text: #e6e6e0;
    --display: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #14181d;
      --surface: #1b2128;
      --surface-2: #222a32;
      --line: #3a444e;
      --line-soft: #2b333b;
      --text: #e8edf2;
      --text-dim: #9aa7b3;
      --text-faint: #6b7885;
      --accent: #e8975a;
      --accent-2: #f0ac78;
      --ok: #6bbf94;
      --ok-soft: #1e2f26;
      --danger: #d97a63;
      --danger-soft: #35201a;
      --warn: #7fa8d6;
      --code-bg: #0d1013;
      --code-text: #e6e6e0;
    }
  }
  :root[data-theme="dark"]{
    --bg: #14181d;
    --surface: #1b2128;
    --surface-2: #222a32;
    --line: #3a444e;
    --line-soft: #2b333b;
    --text: #e8edf2;
    --text-dim: #9aa7b3;
    --text-faint: #6b7885;
    --accent: #e8975a;
    --accent-2: #f0ac78;
    --ok: #6bbf94;
    --ok-soft: #1e2f26;
    --danger: #d97a63;
    --danger-soft: #35201a;
    --warn: #7fa8d6;
    --code-bg: #0d1013;
    --code-text: #e6e6e0;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Shell layout ===== */
  .shell{
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px){
    .shell{ grid-template-columns: 1fr; }
    .rail{ position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line-soft); }
  }

  /* ===== Rail (timeline nav) ===== */
  .rail{
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    border-right: 1px solid var(--line-soft);
    padding: 28px 20px 28px 26px;
    display: flex;
    flex-direction: column;
  }
  .rail-head{ margin-bottom: 28px; }
  .rail-eyebrow{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .rail-title{
    font-family: var(--display);
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    line-height: 1.25;
  }

  .steps{ list-style: none; margin: 0; padding: 0; position: relative; flex: 1; }
  .steps::before{
    content: "";
    position: absolute;
    left: 9px; top: 6px; bottom: 6px;
    width: 1px;
    background: var(--line);
  }
  .step-item{ position: relative; padding: 0 0 22px 30px; }
  .step-item:last-child{ padding-bottom: 0; }
  .step-dot{
    position: absolute; left: 3px; top: 2px;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--line);
    transition: border-color .2s ease, background .2s ease;
  }
  .step-btn{
    all: unset;
    cursor: pointer;
    display: block;
    width: 100%;
  }
  .step-num{
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }
  .step-label{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.4;
    margin-top: 2px;
  }
  .step-item.active .step-dot{ border-color: var(--accent); background: var(--accent); }
  .step-item.active .step-label{ color: var(--text); }
  .step-item.done .step-dot{ border-color: var(--ok); background: var(--ok); }
  .step-item:hover .step-label{ color: var(--text); }

  .rail-foot{
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    line-height: 1.6;
  }

  /* ===== Language toggle ===== */
  .lang-toggle{
    display: inline-flex;
    align-items: center;
    gap: 0;
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    cursor: pointer;
    padding: 0;
    font-family: var(--mono);
  }
  .lang-toggle span{
    padding: 4px 10px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    transition: background .15s ease, color .15s ease;
  }
  .lang-toggle span.on{
    background: var(--accent);
    color: #fff9f2;
    font-weight: 600;
  }
  .lang-toggle:hover{ border-color: var(--accent); }
  .lang-toggle:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== Main stage ===== */
  .stage{
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .panels{ flex: 1; position: relative; }
  .panel{
    display: none;
    padding: 56px 64px 40px;
    max-width: 880px;
    animation: rise .35s ease;
  }
  @media (max-width: 640px){ .panel{ padding: 36px 22px 28px; } }
  .panel.active{ display: block; }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .panel{ animation: none; }
  }

  .kicker{
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kicker .date{ color: var(--text-faint); text-transform: none; letter-spacing: 0; }

  h1.panel-title{
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.15;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .panel-sub{
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text-dim);
    max-width: 62ch;
    margin: 0 0 32px;
    line-height: 1.6;
  }

  .beat{
    display: grid;
    grid-template-columns: 108px 1fr;
    gap: 20px;
    padding: 18px 0;
    border-top: 1px solid var(--line-soft);
  }
  .beat:first-of-type{ border-top: none; }
  .beat-tag{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-top: 3px;
  }
  .beat-tag.problem{ color: var(--danger); }
  .beat-tag.decision{ color: var(--accent); }
  .beat-tag.result{ color: var(--ok); }
  .beat-body h3{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    margin: 0 0 6px;
  }
  .beat-body p{
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .beat-body p:last-child{ margin-bottom: 0; }
  .beat-body code{
    font-family: var(--mono);
    font-size: 0.92em;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text);
  }

  .codeblock{
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    overflow-x: auto;
    margin: 10px 0 8px;
    white-space: pre;
  }
  .codeblock .c1{ color: #8a8270; }
  .codeblock .num{ color: var(--accent-2); }

  .stat-row{
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 10px 0 8px;
  }
  .stat{
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 120px;
  }
  .stat .num{
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat .num .arrow{ color: var(--text-faint); font-weight: 400; font-size: 15px; padding: 0 4px; }
  .stat .lbl{ font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .stat.good .num{ color: var(--ok); }

  .commit-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 3px 8px;
    margin: 2px 4px 2px 0;
  }
  .commit-chip .hash{ color: var(--accent); }

  .arch-mini{
    display: flex;
    align-items: center;
    gap: 0;
    margin: 18px 0 6px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .arch-box{
    flex: 1;
    padding: 14px 12px;
    text-align: center;
    border-right: 1px solid var(--line-soft);
  }
  .arch-box:last-child{ border-right: none; }
  .arch-box.nocuda{ background: var(--surface); }
  .arch-box.cuda{ background: var(--surface-2); }
  .arch-box .t{ font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
  .arch-box .d{ font-size: 10.5px; color: var(--text-faint); margin-top: 3px; }
  .arch-box.nocuda .t{ color: #3a5f8a; }
  .arch-box.cuda .t{ color: var(--ok); }

  .threat-scale{ display: flex; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
  .threat-pill{
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .threat-pill .dot{ width: 7px; height: 7px; border-radius: 50%; }

  /* ===== Nav footer ===== */
  .stage-nav{
    position: sticky;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 64px;
    background: var(--bg);
    border-top: 1px solid var(--line-soft);
  }
  @media (max-width: 640px){ .stage-nav{ padding: 14px 22px; } }
  .nav-btn{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: border-color .15s ease, transform .1s ease;
  }
  .nav-btn:hover{ border-color: var(--accent); }
  .nav-btn:active{ transform: scale(0.98); }
  .nav-btn:disabled{ opacity: 0.35; cursor: default; }
  .nav-btn:disabled:hover{ border-color: var(--line); }
  .nav-btn.primary{ background: var(--accent); border-color: var(--accent); color: #fff9f2; }
  .nav-btn.primary:hover{ border-color: var(--accent-2); background: var(--accent-2); }
  .nav-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .progress-text{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  /* ===== Figures (diagrams) ===== */
  figure.fig{ margin: 20px 0 8px; }
  .fig-card{
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    padding: 18px 18px 6px;
    overflow-x: auto;
  }
  .fig-card svg{ display: block; max-width: 100%; height: auto; }
  figcaption{
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.55;
    margin-top: 10px;
    padding: 0 2px 2px;
  }

  /* ===== Deep-dive code panels ===== */
  .code-panel{
    margin: 12px 0 8px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
  }
  .code-panel-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line-soft);
  }
  .code-panel-head .fname{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .code-panel-head .flabel{
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .code-panel .codeblock{
    margin: 0;
    border-radius: 0;
  }
  .codeblock .kw{ color: #d6ab5f; }
  .codeblock .str{ color: #9fb98a; }
  .codeblock .fn{ color: #8fb3d9; }

  .explain-box{
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 0 7px 7px 0;
    padding: 14px 18px;
    margin: 10px 0 8px;
  }
  .explain-box h4{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10.5px;
  }
  .explain-box p{
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .explain-box p:last-child{ margin-bottom: 0; }
  .explain-box code{
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text);
  }

  /* ===== Q&A block (entrevista) ===== */
  .qa-section{
    margin-top: 34px;
    padding-top: 22px;
    border-top: 2px solid var(--line);
  }
  .qa-section-head{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .qa-section-head .icon{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 7px;
    letter-spacing: 0.04em;
  }
  .qa-section-head h3{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    margin: 0;
  }
  .qa-item{
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .qa-q{
    all: unset;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 13px 16px;
    cursor: pointer;
    box-sizing: border-box;
  }
  .qa-q:focus-visible{ outline: 2px solid var(--accent); outline-offset: -2px; }
  .qa-q .qmark{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    flex-shrink: 0;
    line-height: 1.5;
  }
  .qa-q .qtext{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
    flex: 1;
  }
  .qa-q .chev{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    flex-shrink: 0;
    transition: transform .15s ease;
    line-height: 1.5;
  }
  .qa-item.open .qa-q .chev{ transform: rotate(90deg); }
  .qa-a{
    display: none;
    padding: 0 16px 16px 40px;
  }
  .qa-item.open .qa-a{ display: block; }
  .qa-a p{
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .qa-a p:last-child{ margin-bottom: 0; }
  .qa-a code{
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text);
  }

  /* ===== Pólya beat tags ===== */
  .beat-tag.entender{ color: var(--warn); }
  .beat-tag.simular{ color: #7a5aa8; }
  .beat-tag.escribir{ color: var(--accent); }
  .beat-tag.medir{ color: var(--ok); }
  .beat-tag.mirar{ color: var(--danger); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .beat-tag.simular{ color:#b39ddb; } }
  :root[data-theme="dark"] .beat-tag.simular{ color:#b39ddb; }
  @media (max-width: 640px){
    .beat{ grid-template-columns: 1fr; gap: 6px; }
  }

  .polya{ display:flex; flex-wrap:wrap; gap:6px; margin: 4px 0 22px; }
  .polya span{ font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
    border:1px solid var(--line-soft); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
  .polya .entender{ color: var(--warn); } .polya .simular{ color:#7a5aa8; } .polya .escribir{ color: var(--accent); }
  .polya .medir{ color: var(--ok); } .polya .mirar{ color: var(--danger); }

  /* ===== Tables ===== */
  .tbl-wrap{ overflow-x:auto; margin: 10px 0 8px; border:1px solid var(--line-soft); border-radius: 8px; background: var(--surface); }
  table.tbl{ border-collapse: collapse; width:100%; font-size: 13px; }
  table.tbl th, table.tbl td{ padding: 7px 12px; text-align:left; border-bottom:1px solid var(--line-soft); white-space: nowrap; }
  table.tbl th{ font-family: var(--mono); font-size: 10.5px; letter-spacing:.05em; text-transform: uppercase; color: var(--text-faint); background: var(--surface-2); }
  table.tbl td{ color: var(--text-dim); font-variant-numeric: tabular-nums; }
  table.tbl td.n{ font-family: var(--mono); color: var(--text); }
  table.tbl tr:last-child td{ border-bottom: none; }
  table.tbl tr.weak td{ color: var(--danger); }

  /* ===== Honesty box ===== */
  .caveat{ background: var(--danger-soft); border-left: 3px solid var(--danger); border-radius: 0 7px 7px 0; padding: 12px 16px; margin: 10px 0 8px; }
  .caveat h4{ margin:0 0 6px; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color: var(--danger); font-weight:700; }
  .caveat p{ margin:0 0 6px; font-size:13.5px; line-height:1.6; color: var(--text); }
  .caveat p:last-child{ margin-bottom:0; }
  .caveat code, .beat-body li code{ font-family: var(--mono); font-size:.9em; background: var(--surface-2); padding:1px 5px; border-radius:4px; }
  .beat-body ul{ margin: 4px 0 8px; padding-left: 18px; color: var(--text-dim); font-size: 14px; line-height: 1.65; }

  /* ===== Pitch (summary panel) ===== */
  .pitch{ background: var(--surface); border:1px solid var(--line-soft); border-radius: 10px; padding: 18px 20px; margin: 0 0 24px; }
  .pitch p{ margin: 0 0 10px; font-size: 15px; line-height: 1.7; color: var(--text); }
  .pitch p:last-child{ margin-bottom: 0; }
  .pitch .lbl{ font-family: var(--mono); font-size: 10.5px; letter-spacing:.08em; text-transform: uppercase; color: var(--accent); display:block; margin-bottom: 8px; }

  /* ===== SVG text classes ===== */
  .fig-card svg{ color: var(--text-dim); }
  .s-box{ fill: var(--surface-2); stroke: var(--line); }
  .s-box-ok{ fill: var(--ok-soft); stroke: var(--ok); }
  .s-box-bad{ fill: var(--danger-soft); stroke: var(--danger); }
  .s-t{ fill: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .s-d{ fill: var(--text-faint); font-family: var(--sans); font-size: 10.5px; }
  .s-ok{ fill: var(--ok); font-family: var(--mono); font-size: 11px; }
  .s-bad{ fill: var(--danger); font-family: var(--mono); font-size: 11px; }
  .s-line{ stroke: currentColor; stroke-width: 1.4; fill: none; }

  .rail-links{ margin-top: 10px; display:flex; flex-direction: column; gap: 4px; }
  .rail-links a{ color: var(--text-dim); text-decoration: none; font-family: var(--mono); font-size: 10.5px; }
  .rail-links a:hover{ color: var(--accent); }
  .beat-body a, .pitch a, .explain-box a{ color: var(--accent-2); }

  /* ===== Global map ===== */
  .fig.map{ margin: 0 0 26px; }
  .map-card{ padding: 10px 12px 4px; }
  .map-card svg{ min-width: 640px; }
  .map-node{ cursor: pointer; }
  .map-node rect{ fill: var(--surface); stroke: var(--line-soft); stroke-width: 1; transition: stroke .15s ease; }
  .map-node .mt{ font-family: var(--mono); font-size: 12px; font-weight: 600; fill: var(--text-faint); }
  .map-node .md{ font-family: var(--sans); font-size: 10px; font-weight: 400; fill: var(--text-faint); }
  .map-node.m-on rect{ fill: var(--surface-2); stroke: var(--accent); stroke-width: 2; }
  .map-node.m-on .mt{ fill: var(--accent); }
  .map-node.m-on .md{ fill: var(--text-dim); }
  .map-node:hover rect, .map-node:focus-visible rect{ stroke: var(--accent-2); }
  .map-node:focus{ outline: none; }

  /* ===== Layout fixes + compact mobile rail ===== */
  .shell{ grid-template-columns: 260px minmax(0, 1fr); }
  .stage{ min-width: 0; }
  @media (max-width: 860px){
    .shell{ grid-template-columns: minmax(0, 1fr); }
    .rail{ padding: 16px 16px 12px; }
    .rail-head{ margin-bottom: 10px; }
    .steps{ display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; flex: none; }
    .steps::before{ display: none; }
    .step-item{ padding: 0; flex: 0 0 auto; }
    .step-dot{ display: none; }
    .step-btn{ border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 10px; max-width: 190px; background: var(--surface); }
    .step-item.active .step-btn{ border-color: var(--accent); }
    .step-label{ font-size: 12.5px; }
    .rail-foot{ margin-top: 10px; padding-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .rail-foot > span{ display: none; }
    .rail-links{ margin-top: 0; }
    .lang-toggle{ margin-top: 0; }
    .stage-nav{ padding: 12px 16px; }
  }
  .beat{ grid-template-columns: 108px minmax(0, 1fr); }
  .beat-body{ min-width: 0; }
  @media (max-width: 640px){ .beat{ grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 860px){
    .rail{ position: static; height: auto; overflow: visible; }
    .stage{ min-height: auto; }
  }
  @media (max-width: 640px){
    .fig-card svg{ min-width: 560px; }
  }

  /* ===== Wide screens: centered column, bigger figures ===== */
  .panel{ max-width: 1160px; margin-inline: auto; padding: 56px 56px 40px; }
  .panel-sub, .beat-body > p, .beat-body > ul, .explain-box p, .caveat p, .qa-a p, .pitch p{ max-width: 80ch; }
  .stage-nav{ padding-inline: max(24px, calc((100% - 1160px) / 2 + 56px)); }
  .fig-card{ position: relative; }
  .fig-card svg{ width: 100%; }
  .fig-zoom{ position: absolute; top: 8px; right: 8px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .fig-zoom:hover, .fig-zoom:focus-visible{ color: var(--accent); border-color: var(--accent); outline: none; }
  .lightbox{ position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 94%, transparent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; gap: 14px; }
  .lightbox[hidden]{ display: none !important; }
  .lightbox .lb-card{ background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px;
    width: min(96vw, 1700px); max-height: 82vh; overflow: auto; }
  .lightbox .lb-card svg{ width: 100%; height: auto; min-width: 900px; display: block; color: var(--text-dim); }
  .lightbox .lb-cap{ max-width: 90ch; color: var(--text-dim); font-size: 14px; line-height: 1.6; text-align: center; }
  .lightbox .lb-close{ font-family: var(--sans); font-weight: 600; font-size: 13px; padding: 9px 16px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
  @media (max-width: 640px){ .panel{ padding: 32px 18px 28px; } .lightbox{ padding: 12px; } }
  .lightbox{ background: var(--bg); }
  .lightbox .lb-card svg{ max-height: 72vh; }

  /* ===== Glossary ===== */
  .c-count{ font-family: var(--mono); font-size: 12px; color: var(--accent); margin: -16px 0 18px; }
  .c-group{ margin: 0 0 26px; }
  .c-group h3{ font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); }
  .concept{ display: grid; grid-template-columns: 130px minmax(0,1fr) auto; gap: 14px; align-items: start; padding: 12px 14px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface); margin-bottom: 8px; }
  .concept.known{ border-color: var(--ok); }
  .concept.pending{ opacity: .7; border-style: dashed; }
  .c-body h4{ margin: 0 0 3px; font-size: 14px; font-weight: 700; color: var(--text); }
  .c-body p{ margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text-dim); }
  .c-check{ display: flex; gap: 7px; align-items: center; font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); cursor: pointer; padding-top: 2px; }
  .c-check input{ accent-color: var(--ok); width: 15px; height: 15px; }
  .concept.known .c-check{ color: var(--ok); }
  .c-go{ font-family: var(--mono); font-size: 11px; color: var(--text-dim); background: none; border: 1px solid var(--line-soft); border-radius: 6px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  .c-go:hover, .c-go:focus-visible{ color: var(--accent); border-color: var(--accent); outline: none; }
  @media (max-width: 640px){ .concept{ grid-template-columns: minmax(0,1fr); gap: 8px; } .c-go{ justify-self: start; } }

</style>

<body>
<noscript><p style="padding:24px">Esta página necesita JavaScript. / This page needs JavaScript.</p></noscript>
<div class="shell">
  <nav class="rail" id="rail">
    <div class="rail-head">
      <p class="rail-eyebrow" id="railEyebrow"></p>
      <p class="rail-title" id="railTitle"></p>

    <div class="stage-nav">
      <button class="nav-btn" id="prevBtn"></button>

    </div>
  </main>
</div>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
  <div class="lb-card"></div>
  <p class="lb-cap"></p>
  <button class="lb-close" type="button"></button>
</div>

<script>
/* ===== Content helpers ===== */
let figCounter = 0;
function fig(svgInner, viewBox, caption, ariaLabel){
  figCounter++;
  const mid = `arrow-fig-${figCounter}`;
  const withIds = svgInner.replace(/url\(#arrow\)/g, `url(#${mid})`);
  return `<figure class="fig"><div class="fig-card">
      <svg viewBox="${viewBox}" role="img" aria-label="${ariaLabel}">
        <defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
        ${withIds}
      </svg></div><figcaption>${caption}</figcaption></figure>`;
}
function code(fname, label, body){
  return `<div class="code-panel"><div class="code-panel-head"><span class="fname">${fname}</span><span class="flabel">${label}</span></div>
    <div class="codeblock">${body}</div></div>`;
}
function explain(title, body){ return `<div class="explain-box"><h4>${title}</h4>${body}</div>`; }
function caveat(title, body){ return `<div class="caveat"><h4>${title}</h4>${body}</div>`; }
function table(head, rows, weakRows = []){
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="${weakRows.includes(i) ? 'weak' : ''}">${r.map((c, j) => `<td class="${j > 0 ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function stats(items){
  return `<div class="stat-row">${items.map(s => `<div class="stat ${s.good ? 'good' : ''}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`).join('')}</div>`;
}
/* Shared SVG figures (language-neutral parts) */
function pipelineSvg(labels){
  // labels: [[title, desc] x5]
  return labels.map(([t, d], i) => {
    const x = 20 + i * 196;
    return `<rect class="s-box" x="${x}" y="24" width="168" height="62" rx="7"/>
      <text class="s-t" x="${x + 84}" y="50" text-anchor="middle">${t}</text>
      <text class="s-d" x="${x + 84}" y="70" text-anchor="middle">${d}</text>
      ${i < labels.length - 1 ? `<line class="s-line" x1="${x + 168}" y1="55" x2="${x + 192}" y2="55" marker-end="url(#arrow)"/>` : ''}`;
  }).join('');
}

/* ===== Glossary: what this repo taught me =====
   Each concept: group, phase id where it shows up, ES/EN term + one-line definition. */
const CONCEPT_GROUPS = {
  datos:   {es:'Datos y anotación', en:'Data and annotation'},
  train:   {es:'Entrenamiento y evaluación', en:'Training and evaluation'},
  quant:   {es:'Precisión y cuantización', en:'Precision and quantization'},
  edge:    {es:'Edge y medida', en:'Edge and measurement'},
  metodo:  {es:'Método', en:'Method'}
};
const CONCEPTS = [
  // Datos y anotación
  {id:'olvido', g:'datos', phase:'dataset',
   es:['Olvido catastrófico','Al hacer fine-tuning con clases nuevas, YOLO sustituye la cabeza de detección y olvida las clases que no están en el nuevo dataset. Por eso todas las clases van en un solo dataset.'],
   en:['Catastrophic forgetting','Fine-tuning on new classes replaces the YOLO detection head, so classes missing from the new dataset are forgotten. That is why every class goes into one dataset.']},
  {id:'combinado', g:'datos', phase:'dataset',
   es:['Dataset combinado','Un subconjunto de COCO con las clases útiles más las clases nuevas de otra fuente, con IDs que no se solapan (0-17 COCO, 18-23 Open Images).'],
   en:['Combined dataset','A COCO subset with the useful classes plus the new classes from another source, with non-overlapping IDs (0-17 COCO, 18-23 Open Images).']},
  {id:'manifiesto', g:'datos', phase:'dataset',
   es:['Manifiesto de datos','Lista versionada de IDs exactos de imágenes. Reproduce el dataset aunque la regla de selección original no se pueda reconstruir.'],
   en:['Data manifest','A versioned list of exact image IDs. It reproduces the dataset even when the original selection rule cannot be recovered.']},
  {id:'parciales', g:'datos', phase:'dataset',
   es:['Etiquetas parciales','Un objeto real sin caja cuenta como fondo. Al combinar fuentes, cada una deja sin etiquetar las clases de la otra.'],
   en:['Partial labels','A real object without a box counts as background. When sources are combined, each leaves the other\'s classes unlabelled.']},
  {id:'zero-shot', g:'datos', phase:'stairs',
   es:['Detección zero-shot','Detectar a partir de un texto clases que el modelo no vio etiquetadas (Grounding DINO). Sirve para proponer etiquetas; su calidad se mide contra etiquetas humanas.'],
   en:['Zero-shot detection','Detecting from a text prompt classes the model never saw labelled (Grounding DINO). Good for proposing labels; its quality is measured against human labels.']},
  {id:'pseudo', g:'datos', phase:'stairs',
   es:['Pseudo-etiquetas','Etiquetas generadas por otro modelo. El detector hereda sus falsos positivos y sus omisiones.'],
   en:['Pseudo-labels','Labels produced by another model. The detector inherits its false positives and misses.']},
  // Entrenamiento y evaluación
  {id:'map', g:'train', phase:'entrenar',
   es:['mAP50 frente a mAP50-95','mAP50 cuenta como acierto una caja con IoU ≥ 0,5; mAP50-95 promedia umbrales de 0,5 a 0,95 y premia cajas ajustadas.'],
   en:['mAP50 vs mAP50-95','mAP50 counts a box as correct at IoU ≥ 0.5; mAP50-95 averages thresholds from 0.5 to 0.95 and rewards tight boxes.']},
  {id:'por-clase', g:'train', phase:'fp16-int8',
   es:['Métrica por clase','El mAP global puede no moverse mientras una clase crítica se hunde. Se decide mirando las clases que importan.'],
   en:['Per-class metrics','Global mAP can stay flat while a critical class collapses. Decisions look at the classes that matter.']},
  {id:'ruido-clase', g:'train', phase:'entrenar',
   es:['Ruido de clases pequeñas','Con 45 instancias de validación, unas centésimas de AP son ruido. Hace falta más test antes de concluir.'],
   en:['Small-class noise','With 45 validation instances, a few hundredths of AP are noise. More test data is needed before concluding.']},
  {id:'backbone', g:'train', phase:'entrenar',
   es:['Backbone, neck y head','El backbone extrae características, el neck las combina a varias escalas y el head predice cajas y clases. El fine-tuning aquí reentrena todo, sin congelar.'],
   en:['Backbone, neck and head','The backbone extracts features, the neck mixes them across scales and the head predicts boxes and classes. Fine-tuning here retrains everything, nothing frozen.']},
  {id:'nms-free', g:'train', phase:'entrenar',
   es:['Detección sin NMS','YOLO26 es end-to-end: no necesita non-maximum suppression después, lo que simplifica el export y quita post-proceso en edge.'],
   en:['NMS-free detection','YOLO26 is end-to-end: no non-maximum suppression afterwards, which simplifies export and removes post-processing on edge.']},
  {id:'metodos-ft', g:'train', phase:'entrenar',
   es:['Métodos de fine-tuning','Todo el modelo, backbone congelado, descongelado progresivo, distilación (s enseña a n), QAT o adaptadores como LoRA (más en transformers).'],
   en:['Fine-tuning methods','Full model, frozen backbone, progressive unfreezing, distillation (s teaches n), QAT, or adapters like LoRA (mostly in transformers).']},
  // Precisión y cuantización
  {id:'fp16', g:'quant', phase:'fp16-int8',
   es:['FP32, FP16 e INT8','32 o 16 bits en coma flotante, o enteros de 8 bits. Menos bits: menos memoria y cálculo más rápido si hay kernels para ello, a cambio de rango y resolución.'],
   en:['FP32, FP16 and INT8','32- or 16-bit floating point, or 8-bit integers. Fewer bits: less memory and faster compute when kernels exist, at the cost of range and resolution.']},
  {id:'ptq-qat', g:'quant', phase:'fp16-int8',
   es:['PTQ frente a QAT','PTQ cuantiza un modelo ya entrenado usando datos de calibración. QAT simula INT8 durante unas épocas extra para que la red compense el redondeo.'],
   en:['PTQ vs QAT','PTQ quantizes a trained model using calibration data. QAT simulates INT8 during extra epochs so the network compensates for rounding.']},
  {id:'calibracion', g:'quant', phase:'fp16-int8',
   es:['Calibración','Pasar imágenes reales para medir el rango de cada activación y fijar la escala INT8. Calibrar con el set de evaluación contamina la medida.'],
   en:['Calibration','Running real images to measure each activation\'s range and set the INT8 scale. Calibrating on the evaluation set contaminates the measurement.']},
  {id:'minmax', g:'quant', phase:'fp16-int8',
   es:['MinMax frente a Entropy','MinMax usa el rango observado completo: un valor extremo quita resolución al resto. Entropy recorta el rango para perder menos información.'],
   en:['MinMax vs Entropy','MinMax uses the full observed range: one outlier costs everyone else resolution. Entropy clips the range to lose less information.']},
  {id:'implicita', g:'quant', phase:'fp16-int8',
   es:['Cuantización implícita frente a explícita','Implícita: TensorRT calibra al construir el engine (obsoleta desde TensorRT 10). Explícita: las escalas van en el ONNX como nodos Q/DQ.'],
   en:['Implicit vs explicit quantization','Implicit: TensorRT calibrates while building the engine (deprecated since TensorRT 10). Explicit: the scales live in the ONNX as Q/DQ nodes.']},
  {id:'fallback', g:'quant', phase:'fp16-int8',
   es:['Precisión de respaldo','Las capas sin kernel INT8 corren en otra precisión. Si es FP32 en vez de FP16, INT8 puede salir más lento que FP16.'],
   en:['Fallback precision','Layers without an INT8 kernel run in another precision. If that is FP32 instead of FP16, INT8 can end up slower than FP16.']},
  // Edge y medida
  {id:'engine', g:'edge', phase:'metodologia',
   es:['Engine de TensorRT','Plan compilado para una GPU y una versión de TensorRT concretas. No es portable: se construye en el dispositivo que lo ejecuta.'],
   en:['TensorRT engine','A plan compiled for one GPU and one TensorRT version. Not portable: it is built on the device that runs it.']},
  {id:'percentiles', g:'edge', phase:'metodologia',
   es:['Media frente a p95/p99','La media esconde los picos; en tiempo real importa la cola. Un p99 de 172 ms con media de 35 ms es un sistema que a veces se congela.'],
   en:['Mean vs p95/p99','The mean hides spikes; real time lives in the tail. A 172 ms p99 with a 35 ms mean is a system that sometimes freezes.']},
  {id:'warmup-sync', g:'edge', phase:'metodologia',
   es:['Warm-up y sincronización','Las primeras inferencias incluyen inicialización. Y la GPU trabaja en asíncrono: sin <code>torch.cuda.synchronize()</code> el cronómetro para antes de tiempo.'],
   en:['Warm-up and synchronization','The first inferences include initialization. And the GPU runs asynchronously: without <code>torch.cuda.synchronize()</code> the timer stops too early.']},
  {id:'cuello', g:'edge', phase:'jetson',
   es:['Cuello de botella','El recurso que se agota primero manda. En el Jetson es la CPU: un engine más rápido no se nota extremo a extremo.'],
   en:['Bottleneck','The first resource to run out sets the pace. On the Jetson it is the CPU: a faster engine does not show end to end.']},
  {id:'unificada', g:'edge', phase:'jetson',
   es:['Memoria unificada','En el Jetson CPU y GPU comparten 7,6 GB. No hay VRAM que reservar: lo que usa la GPU se lo quita al sistema.'],
   en:['Unified memory','On the Jetson, CPU and GPU share 7.6 GB. There is no VRAM to reserve: what the GPU uses, the system loses.']},
  {id:'engine-solo', g:'edge', phase:'jetson',
   es:['Latencia del engine solo','Medir la red sin pre/post-proceso ni Python separa lo que cuesta el modelo de lo que cuesta el código alrededor.'],
   en:['Engine-only latency','Timing the network without pre/post-processing or Python separates what the model costs from what the surrounding code costs.']},
  // Método
  {id:'polya', g:'metodo', phase:'resumen',
   es:['Los 5 pasos','Entender, simular con números, escribir, medir y mirar atrás. Adaptado de Pólya (1945).'],
   en:['The 5 steps','Understand, simulate with numbers, write, measure, look back. Adapted from Pólya (1945).']},
  {id:'prerregistro', g:'metodo', phase:'stairs',
   es:['Prerregistro','Escribir diseño y criterio de decisión, y hacer commit, antes de ver resultados. El historial de git lo demuestra.'],
   en:['Pre-registration','Writing the design and decision criterion, and committing it, before seeing results. The git history proves it.']},
  {id:'reproducible', g:'metodo', phase:'metodologia',
   es:['Número con ficha','Cada cifra publicada sale de un JSON con hardware, versiones, commit y comando. Las tablas se generan; nunca se escriben a mano.'],
   en:['Numbers with provenance','Every published figure comes from a JSON with hardware, versions, commit and command. Tables are generated, never typed.']},
  {id:'fallos', g:'metodo', phase:'fp16-int8',
   es:['Registrar los fallos','Un engine que no se construye también es un resultado: se guarda con el error real y aparece en la tabla.'],
   en:['Recording failures','An engine that fails to build is a result too: it is stored with the real error and shows in the table.']}
];

function conceptsHtml(lang){
  const L = lang === 'es'
    ? {intro:'Todo lo que me enseñó este repo, en una línea por concepto. Marca los que sabrías explicar sin mirar: la marca se guarda en este navegador.', known:'sé explicarlo', see:'ver fase', pending:'pendiente'}
    : {intro:'Everything this repo taught me, one line per concept. Tick the ones you could explain without looking: ticks are saved in this browser.', known:'I can explain it', see:'see phase', pending:'pending'};
  const groups = Object.keys(CONCEPT_GROUPS).map(g => {
    const items = CONCEPTS.filter(c => c.g === g).map(c => {
      const [t, d] = c[lang];
      return `<div class="concept${c.pending ? ' pending' : ''}">
        <label class="c-check"><input type="checkbox" data-concept="${c.id}" ${c.pending ? 'disabled' : ''}><span>${c.pending ? L.pending : L.known}</span></label>
        <div class="c-body"><h4>${t}</h4><p>${d}</p></div>
        <button class="c-go" type="button" data-go="${c.phase}">${L.see} →</button>
      </div>`;
    }).join('');
    return `<section class="c-group"><h3>${CONCEPT_GROUPS[g][lang]}</h3>${items}</section>`;
  }).join('');
  return `<p class="panel-sub">${L.intro}</p>
    <p class="c-count" data-count-tpl="${lang}"></p>
    ${groups}`;
}
function conceptCountLabel(lang, a, b){ return lang === 'es' ? `${a} de ${b} que sé explicar` : `${a} of ${b} I can explain`; }

/* ===== Language-neutral figures ===== */
function latencyBarSvg(l){
  // Jetson nano FP16, measured (benchmarks/results): total 22.89 ms
  const segs = [[l.pre,'7.1','s-box'],[l.engine,'4.1','s-box-ok'],[l.wrap,'8.7','s-box'],[l.post,'2.1','s-box'],[l.other,'1.0','s-box']];
  const widths = [7.07, 4.06, 8.74, 2.07, 0.95];
  let x = 20;
  return segs.map((s, i) => {
    const w = widths[i] * 34;
    const out = `<rect class="${s[2]}" x="${x}" y="30" width="${w}" height="46" rx="4"/>
      <text class="s-t" x="${x + w/2}" y="58" text-anchor="middle">${s[1]}</text>

}

/* 4 · FP16 / INT8 */
{
  id: 'fp16-int8', label: 'FP16, INT8 and a criterion first', date: 'Sep 16–17, 2026',
  focus: ['exportar','evaluar'],
  title: 'INT8 did not earn its place',
  sub: 'Two INT8 routes, two TensorRT bugs and a rule fixed before measuring. Outcome: FP16 in every case.',
  beats: [
    {tag:'entender', h:'What quantizing is', body:`<p>Moving weights and activations from floating point to 8-bit integers. Each tensor needs a <strong>scale</strong>, found by <strong>calibrating</strong> with real images. <strong>PTQ</strong> does this on a trained model; <strong>QAT</strong> simulates the rounding during training so the network compensates.</p>
    ${explain('Criterion written on September 16, before measuring', `<p>INT8 replaces FP16 only if p95 drops by at least 20 %, mAP50 drops by at most 0.01 and <code>Stairs</code> by at most 0.02.</p>`)}`},
    {tag:'simular', h:'Two traps in the default INT8', body:`<p>Reading Ultralytics 8.4.14: by default it <strong>calibrates on the validation split</strong>, the same one used to score the engine, and builds with only the INT8 flag, so <strong>unquantized layers fall back to FP32</strong>, not FP16. It also uses the MinMax calibrator, which is sensitive to outliers.</p>`},
    {tag:'escribir', h:'Two routes', body:`<p><strong>Implicit</strong> (<code>int8=True</code>): calibrating on 1,000 train images. <strong>Explicit</strong>: NVIDIA ModelOpt writes a Q/DQ ONNX once, and each device builds its INT8 + FP16 engine from that same file, with the same scales.</p>`},
    {tag:'medir', h:'Results', body:`${table(['Device · model','FP16 engine','INT8 engine','mAP50 FP16 → INT8','Stairs FP16 → INT8'], [
      ['RTX · nano (implicit)','0.62 ms','0.84 ms','0.394 → 0.376','0.225 → 0.240'],
      ['RTX · small (implicit)','1.06 ms','1.21 ms','0.463 → 0.415','0.385 → 0.311'],
      ['Jetson · nano (Q/DQ)','4.06 ms','4.35 ms','0.394 → 0.371','0.225 → 0.265'],
      ['Jetson · small (Q/DQ)','6.67 ms','5.10 ms','0.463 → 0.400','0.391 → 0.186']
    ], [1,3])}
    <ul>
      <li>Implicit INT8 <strong>does not build</strong> on TensorRT 10.3 (Jetson): an internal <code>checkSanity</code> assertion, a known bug.</li>
      <li>Q/DQ <strong>does not build</strong> on TensorRT 10.16 on the RTX (Blackwell): <code>MyelinCheckException</code>, another known bug. It does on the Jetson.</li>
      <li>No combination passes the criterion. Failures are recorded with the real error.</li>
    </ul>`},
    {tag:'mirar', h:'Look per class', body:`${caveat('A drop the global mAP hides', `<p>Converting nano to FP16 costs 0.002 global mAP50, but <code>Stairs</code> falls from 0.316 to 0.225, <strong>identically on both devices</strong>. And PTQ INT8 sinks small\'s <code>Stairs</code> from 0.391 to 0.186. Looking only at the global number, I would have approved both.</p>`)}`}
  ],
  qa: [
    {q:'Why can INT8 be slower than FP16?', a:`<p>If layers without INT8 kernels run in FP32, there are format conversions between layers and compute in the most expensive precision. On small models the INT8 savings are small next to that cost.</p>`},
    {q:'When would I use INT8 on a Jetson?', a:`<p>FP16 by default. INT8 when the model is large and the GPU is the bottleneck (VLM, depth), when it does not fit in memory, or with DLA (which the Orin Nano lacks), always validated per class and preferably with mixed precision or QAT.</p>`},
    {q:'What happens if I calibrate on validation data?', a:`<p>The scales fit the very images I then measure on, so the evaluation turns optimistic. It is leakage, like training on the test set.</p>`}
  ]
},

    {tag:'entender', h:'Design and criterion first', body:`<p>Three nano models, same recipe: <strong>A</strong> baseline; <strong>B</strong> + 1,000 stairs images labelled by Grounding DINO; <strong>C</strong> + the same images with human labels. Design and criterion were committed before training.</p>

    {tag:'simular', h:'Pseudo-label quality', body:`<p>Against the human boxes at IoU ≥ 0.5: <strong>precision 0.59</strong> (4 in 10 boxes are extra) and <strong>recall 0.72</strong>. 1,554 boxes against 1,291 human ones; 17 images got none.</p>`},
    {tag:'medir', h:'Result', body:`${fig(stairsBarsSvg(['A · baseline','B · auto labels','C · human labels']), '0 0 600 185', 'Stairs AP50 on the test set (120 images, 140 instances). B captures 0.079 of the 0.126 that C gains.', 'Bars of Stairs AP50 per arm')}
    <p>B gains <strong>+0.079</strong>, C <strong>+0.126</strong>: auto-annotation captures <strong>63 %</strong> and does not hurt the global score (0.398 vs 0.396). <strong>It passes the criterion.</strong> At AP50-95, B and C are within 0.005: the auto boxes are tight; what fails is extra or missed stairs.</p>`},
    {tag:'mirar', h:'Limits', body:`${caveat('Do not over-generalize', `<p>One seed per arm; 140 test instances (the Open Images test split had no more); photos, not first-person video. On val (45 instances) B beats C, which shows why the test set was the primary metric.</p>`)}`}
  ],
  qa: [
    {q:'Why did no human review the automatic labels?', a:`<p>Because the design already had human reference labels for those images: the auto-annotator\'s quality can be measured exactly, with no manual work.</p>`},
    {q:'What is pre-registration and why does it matter?', a:`<p>Writing down the design and the decision rule before seeing results. It stops me from picking, afterwards, the metric that gives the conclusion I like. The document\'s commit predates every result.</p>`}
  ]
},

/* ===== Explainer engine (shared across repos) =====
   Content lives in PAGE (defined above): PAGE.ui.{es,en}, PAGE.steps.{es,en}.
   Beat tags follow the 5-step method: entender · simular · escribir · medir · mirar */
let currentLang = 'es';
let current = 0;
const KEY = 'explainer-' + PAGE.slug;

function activeSteps(){ return PAGE.steps[currentLang]; }

function renderQA(stepIdx, qaList){
  if (!qaList || !qaList.length) return '';
  const t = PAGE.ui[currentLang];
  return `<div class="qa-section">
    <div class="qa-section-head"><span class="icon">Q&amp;A</span><h3>${t.qaHeading}</h3></div>
    ${qaList.map((item, i) => `
      <div class="qa-item" id="qa-${stepIdx}-${i}">
        <button class="qa-q" data-qa="${stepIdx}-${i}" aria-expanded="false">
          <span class="qmark">Q${i+1}</span><span class="qtext">${item.q}</span><span class="chev">›</span>
        </button>
        <div class="qa-a">${item.a}</div>
      </div>`).join('')}
  </div>`;
}

/* Global map: the whole system, with this phase's part highlighted (zoom out ↔ zoom in) */
function renderMap(stepIdx, focus){
  const m = PAGE.map[currentLang], t = PAGE.ui[currentLang];
  const on = id => focus === 'all' || (focus || []).includes(id);
  const W = 124, G = 18, X0 = 14;
  const nodes = m.nodes.map((n, i) => {
    const x = X0 + i * (W + G);
    return `<g class="map-node ${on(n.id) ? 'm-on' : 'm-off'}" data-node="${n.id}" tabindex="0" role="button" aria-label="${n.t}">
      <rect x="${x}" y="14" width="${W}" height="52" rx="7"/>
      <text class="mt" x="${x + W/2}" y="37" text-anchor="middle">${n.t}</text>
      <text class="md" x="${x + W/2}" y="54" text-anchor="middle">${n.d}</text></g>
      ${i < m.nodes.length - 1 ? `<line class="s-line" x1="${x + W}" y1="40" x2="${x + W + G - 3}" y2="40" marker-end="url(#arrow-map-${stepIdx})"/>` : ''}`;
  }).join('');
  const total = m.nodes.length * W + (m.nodes.length - 1) * G;
  const bw = (total - G) / 2;
  const bands = m.bands.map((b, i) => {
    const x = X0 + i * (bw + G);
    return `<g class="map-node ${on(b.id) ? 'm-on' : 'm-off'}" data-node="${b.id}" tabindex="0" role="button" aria-label="${b.t}">
      <rect x="${x}" y="84" width="${bw}" height="32" rx="7" stroke-dasharray="4 3"/>
      <text class="mt" x="${x + bw/2}" y="104" text-anchor="middle">${b.t} <tspan class="md">· ${b.d}</tspan></text></g>`;
  }).join('');
  return `<figure class="fig map"><div class="fig-card map-card">
    <svg viewBox="0 0 ${total + 2*X0} 128" role="img" aria-label="${t.mapLabel}">
      <defs><marker id="arrow-map-${stepIdx}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      ${nodes}${bands}</svg></div>
    <figcaption>${t.mapCaption}</figcaption></figure>`;
}

function render(){
  const t = PAGE.ui[currentLang];
  const steps = activeSteps();
  const stepsEl = document.getElementById('steps');
  const panelsEl = document.getElementById('panels');
  stepsEl.innerHTML = ''; panelsEl.innerHTML = '';

  document.title = t.docTitle;
  document.documentElement.lang = currentLang;
  document.getElementById('rail').setAttribute('aria-label', t.railAria);
  document.getElementById('railEyebrow').textContent = t.railEyebrow;
  document.getElementById('railTitle').textContent = t.railTitle;
  document.getElementById('railFoot').innerHTML = t.railFoot;
  document.getElementById('railLinks').innerHTML = t.links.map(l => `<a href="${l.href}">${l.label}</a>`).join('');
  document.getElementById('langEs').className = currentLang === 'es' ? 'on' : '';
  document.getElementById('langEn').className = currentLang === 'en' ? 'on' : '';

  steps.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'step-item' + (i === current ? ' active' : '') + (i < current ? ' done' : '');
    li.innerHTML = `<button class="step-btn"><span class="step-dot"></span>
        <span class="step-num">${String(i).padStart(2,'0')} / ${String(steps.length-1).padStart(2,'0')}</span>
        <div class="step-label">${s.label}</div></button>`;
    li.querySelector('button').addEventListener('click', () => go(i));
    stepsEl.appendChild(li);

    const panel = document.createElement('section');
    panel.className = 'panel' + (i === current ? ' active' : '');
    panel.id = 'panel-' + s.id;
    const kicker = s.kicker || (i === 0 ? t.summaryKicker : `${t.phase} ${i}`);
    panel.innerHTML = `
      <p class="kicker">${kicker} <span class="date">· ${s.date}</span></p>
      <h1 class="panel-title">${s.title}</h1>
      <p class="panel-sub">${s.sub}</p>
      ${renderMap(i, s.focus)}
      ${s.intro || ''}
      ${s.beats && s.beats.length ? `<div class="polya">${['entender','simular','escribir','medir','mirar'].map(k => `<span class="${k}">${t.tags[k]}</span>`).join('')}</div>` : ''}
      ${(s.beats || []).map(b => `
        <div class="beat">
          <div class="beat-tag ${b.tag}">${t.tags[b.tag]}</div>
          <div class="beat-body"><h3>${b.h}</h3>${b.body}
            ${b.chips ? `<div>${b.chips.map(c => { const [hash, ...rest] = c.split(' ');
              return `<span class="commit-chip"><span class="hash">${hash}</span>${rest.join(' ')}</span>`; }).join('')}</div>` : ''}
          </div>
        </div>`).join('')}
      ${renderQA(i, s.qa)}`;
    panelsEl.appendChild(panel);
  });

  panelsEl.querySelectorAll('.map-node').forEach(g => {
    const jump = () => { const id = g.dataset.node;
      const idx = activeSteps().findIndex((st, k) => k > 0 && Array.isArray(st.focus) && st.focus.includes(id));
      if (idx >= 0) go(idx); };
    g.addEventListener('click', jump);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(); } });
  });

  panelsEl.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const idx = activeSteps().findIndex(st => st.id === b.dataset.go); if (idx >= 0) go(idx);
  }));
  let known = {};
  try { known = JSON.parse(localStorage.getItem(KEY + '-concepts') || '{}'); } catch(e) {}
  const boxes = panelsEl.querySelectorAll('input[data-concept]');
  const updateCount = () => {
    const enabled = [...boxes].filter(x => !x.disabled);
    const n = enabled.filter(x => x.checked).length;
    panelsEl.querySelectorAll('.c-count').forEach(el => el.textContent = conceptCountLabel(currentLang, n, enabled.length));
  };
  boxes.forEach(x => {
    x.checked = !!known[x.dataset.concept];
    x.closest('.concept').classList.toggle('known', x.checked);
    x.addEventListener('change', () => {
      known[x.dataset.concept] = x.checked;
      x.closest('.concept').classList.toggle('known', x.checked);
      try { localStorage.setItem(KEY + '-concepts', JSON.stringify(known)); } catch(e) {}
      updateCount();
    });
  });
  if (boxes.length) updateCount();

  panelsEl.querySelectorAll('.fig').forEach(f => {
    const card = f.querySelector('.fig-card'); if (!card) return;
    const b = document.createElement('button');
    b.className = 'fig-zoom'; b.type = 'button'; b.textContent = '⤢ ' + t.zoom; b.setAttribute('aria-label', t.zoom);
    b.addEventListener('click', () => openLightbox(f));
    card.appendChild(b);
  });

  panelsEl.querySelectorAll('.qa-q').forEach(btn => btn.addEventListener('click', () => {
    const item = btn.parentElement; const open = item.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  }));

  const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');
  prev.textContent = t.prev; prev.disabled = current === 0;
  next.textContent = current === steps.length - 1 ? t.end : t.next; next.disabled = current === steps.length - 1;
  document.getElementById('progressText').textContent = t.progress(current, steps.length - 1);
  try { localStorage.setItem(KEY + '-step', String(current)); localStorage.setItem(KEY + '-lang', currentLang); } catch(e) {}
}

function openLightbox(figEl){
  const lb = document.getElementById('lightbox');
  const svg = figEl.querySelector('svg').cloneNode(true);
  const cap = figEl.querySelector('figcaption');
  lb.querySelector('.lb-card').replaceChildren(svg);
  lb.querySelector('.lb-cap').innerHTML = cap ? cap.innerHTML : '';
  lb.querySelector('.lb-close').textContent = PAGE.ui[currentLang].close;
  lb.hidden = false; lb.querySelector('.lb-close').focus();
  // clicking a map node inside the lightbox also jumps
  svg.querySelectorAll('.map-node').forEach(g => g.addEventListener('click', () => {
    closeLightbox(); const id = g.dataset.node;
    const idx = activeSteps().findIndex((st, k) => k > 0 && Array.isArray(st.focus) && st.focus.includes(id));
    if (idx >= 0) go(idx);
  }));
}
function closeLightbox(){ document.getElementById('lightbox').hidden = true; }

function go(i){
  if (i < 0 || i >= activeSteps().length) return;
  current = i; render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('langToggle').addEventListener('click', () => { currentLang = currentLang === 'es' ? 'en' : 'es'; render(); });
document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => go(current + 1));
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox' || e.target.classList.contains('lb-close')) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').hidden) { if (e.key === 'Escape') closeLightbox(); return; }
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(current + 1);
  if (e.key === 'ArrowLeft') go(current - 1);
});

(function init(){
  const params = new URLSearchParams(location.search);
  const qLang = params.get('lang');
  try {
    const savedLang = localStorage.getItem(KEY + '-lang');
    if (savedLang === 'es' || savedLang === 'en') currentLang = savedLang;
    else if ((navigator.language || '').slice(0,2) !== 'es') currentLang = 'en';
  } catch(e) {}
  if (qLang === 'es' || qLang === 'en') currentLang = qLang;
  try {
    const saved = localStorage.getItem(KEY + '-step');
    if (saved !== null) current = Math.min(parseInt(saved, 10) || 0, activeSteps().length - 1);
  } catch(e) {}
  render();
})();

</script>
