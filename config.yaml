# =============================================================================
# Fine-Tuning Studio — Configuracion de Entrenamiento
# =============================================================================
# Framework universal para fine-tuning de modelos YOLO.
# La GPU se auto-detecta; batch: -1 ajusta automaticamente segun VRAM.
# =============================================================================

# -----------------------------------------------------------------------------
# DATASET
# -----------------------------------------------------------------------------
data_dir: "data"

# Numero de clases (ajustar segun tu dataset)
nc: 1

# Nombres de clases (ajustar segun tu dataset)
names:
  0: "object"

# -----------------------------------------------------------------------------
# MODELO BASE
# -----------------------------------------------------------------------------
# YOLO26 (Ultralytics >=8.4.14) — NMS-free, end-to-end
# Variantes: yolo26n.pt, yolo26s.pt, yolo26m.pt, yolo26l.pt, yolo26x.pt
# Tareas:    -seg.pt (segmentacion), -cls.pt (clasificacion),
#            -pose.pt (pose), -obb.pt (oriented bounding boxes)
#
# Modelos anteriores tambien soportados: yolov8, yolov11, yolo12
model: "yolo26m.pt"

# Tarea de vision (detect, segment, classify, pose, obb)
task: "detect"

# -----------------------------------------------------------------------------
# PARAMETROS GPU-DEPENDIENTES
# -----------------------------------------------------------------------------

# Batch size (-1 = auto-detect segun VRAM disponible)
batch: -1

# Workers del DataLoader
workers: 8

# Tamano de imagen de entrada
imgsz: 640

# Cachear imagenes: "ram", true (disco), false (sin cache)
# "ram" recomendado si tienes >=32GB RAM de sistema
cache: "ram"

# -----------------------------------------------------------------------------
# PARAMETROS DE ENTRENAMIENTO
# -----------------------------------------------------------------------------
epochs: 100
patience: 20
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
optimizer: "auto"

# Warmup
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# -----------------------------------------------------------------------------
# AUGMENTACION
# -----------------------------------------------------------------------------

# Geometrica
fliplr: 0.5
flipud: 0.0
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 2.0
perspective: 0.0

# Color (HSV)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# Avanzada
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# -----------------------------------------------------------------------------
# GUARDADO Y LOGGING
# -----------------------------------------------------------------------------
project: "runs/train"
name: null
save_period: 10
save: true
plots: true
verbose: true

# -----------------------------------------------------------------------------
# VALIDACION
# -----------------------------------------------------------------------------
val: true
val_fraction: 1.0
iou: 0.7
conf: 0.001

# -----------------------------------------------------------------------------
# HARDWARE
# -----------------------------------------------------------------------------
device: "0"
amp: true
deterministic: false
seed: 42
# =============================================================================
